<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<meta name="description" content="叽咕一下 · I Like to Read! 竖屏共读试读">
<title>叽咕一下 · I Like to Read! 竖屏试读</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#352c28;background:#efebe5;--paper:#faf7f1;--brown:#342a25;--dim:#8c7e73;--peach:#c97853;--border:#eee8e0;--soft:#f3eee6}
*{box-sizing:border-box}body{margin:0}button{font:inherit;border:0;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #dfa77b;outline-offset:3px}a{color:inherit}.shell{max-width:460px;min-height:100dvh;margin:0 auto;background:var(--paper);box-shadow:0 10px 45px #58453115;position:relative}.page{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 19px) 20px calc(env(safe-area-inset-bottom) + 18px)}.simpleHead{display:flex;align-items:center;justify-content:space-between;gap:12px;height:43px;flex:none}.brand{font-size:19px;letter-spacing:-.05em;font-weight:850}.brand small{font-size:10px;font-weight:600;letter-spacing:.17em;color:#ae9d8d;margin-left:6px}.tiny{font-size:12px;color:var(--dim)}.textBtn{font-size:12px;color:#786a60;background:transparent;padding:9px 0}.iconBtn{width:38px;height:38px;display:grid;place-items:center;font-size:22px;background:transparent;border-radius:50%}.iconBtn:hover,.textBtn:hover{background:#efe7dd}.homeTitle{font-size:14px;font-weight:650;color:#8c7d6f;margin:31px 0 13px}.bookEntry{background:#fffcf8;border:1px solid #f0e9e0;border-radius:17px;overflow:hidden}.entryImage{display:flex;justify-content:center;align-items:center;background:#e7efe1;padding:14px}.entryImage img{height:auto;width:min(72%,250px);aspect-ratio:1;object-fit:contain;border-radius:5px;box-shadow:0 7px 24px #4a35251b}.entryBody{padding:19px 18px 20px}.entryBody h1{font-size:26px;letter-spacing:-.045em;margin:0 0 4px}.entryBody p{margin:0 0 18px;color:#897c70;font-size:13px}.metadata{font-size:11px;color:#777568;margin-bottom:13px}.primary{width:100%;border-radius:12px;padding:13px;background:#38312c;color:white;font-weight:700;font-size:14px}.secondary{background:#f0ebe4;border-radius:11px;padding:12px 14px;font-size:13px}.mutedLink{display:block;margin:19px auto 0;background:transparent;color:#918277;font-size:12px;padding:9px}.spacer{flex:1}.foot{margin-top:25px;font-size:11px;color:#a3978c;text-align:center;line-height:1.6}.reading{padding:calc(env(safe-area-inset-top) + 7px) 13px calc(env(safe-area-inset-bottom) + 12px)}.readerHeader{height:47px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.readerHeader .heading{font-size:13px;font-weight:700;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.readerHeader .heading small{font-size:10px;color:#a09386;margin-left:7px;font-weight:600}.heartActive{color:#c97462}.stepProgress{height:3px;border-radius:4px;background:#ece5db;overflow:hidden;margin:0 5px 15px}.stepProgress div{height:100%;background:#cf865f;transition:width .2s}.readMode{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:13px}.segment{padding:3px;background:#efe9e1;border-radius:12px;display:flex;gap:3px}.segment button{padding:8px 16px;font-size:12px;border-radius:9px;background:transparent;color:#817369}.segment button.active{background:#fffdf9;color:#302922;box-shadow:0 1px 4px #70513c10;font-weight:750}.pageCount{font-size:11px;color:#a19286}.artFrame{width:100%;aspect-ratio:1/1;background:#efeae2;border-radius:13px;overflow:hidden;touch-action:pan-y;user-select:none;position:relative;flex:none}.artFrame img{height:100%;width:100%;object-fit:contain;display:block}.imgLoading{position:absolute;inset:0;display:grid;place-items:center;color:#b3a89d;font-size:12px;background:#eee9e2}.artFrame.loaded .imgLoading{display:none}.textPanel{min-height:77px;display:flex;align-items:center;justify-content:center;padding:13px 5px 3px}.readEnglish{font-family:Georgia,"Times New Roman",serif;text-align:center;font-size:clamp(20px,5.8vw,27px);font-weight:700;line-height:1.27;letter-spacing:-.025em;color:#383029;margin:0}.readerTools{display:flex;gap:9px;justify-content:center;margin:11px 0 10px;flex:none}.tool{font-size:12px;border-radius:999px;border:1px solid #e8e1d8;background:#fdfaf6;padding:10px 15px;white-space:nowrap}.tool.listen{color:#955f40;border-color:#ead7c8}.tool:disabled{opacity:.4}.pageControls{display:flex;gap:11px;align-items:center;margin-top:auto;padding-top:9px;flex:none}.pageControls button{flex:1;font-size:13px;font-weight:650;height:46px;border-radius:12px}.prev{background:#eee9e1}.next{background:#352f2a;color:#fff}.prev:disabled{opacity:.36}.gestureHint{text-align:center;font-size:10px;color:#b4a89d;margin:11px 0 0}.sheetScrim{position:fixed;inset:0;background:#38271b57;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,460px);background:#fffcf8;border-radius:20px 20px 0 0;padding:21px 24px calc(env(safe-area-inset-bottom) + 28px);box-shadow:0 -8px 20px #50362719;max-height:78dvh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:14px}.sheetText{font-size:16px;line-height:1.8;margin:8px 0;color:#3a322d}.sheetSub{font-size:12px;line-height:1.9;color:#82746a}.credit{font-size:12px;line-height:1.95;color:#796f64}.credit a{color:#996243;text-decoration:underline}.endGraphic{width:90px;height:90px;display:grid;place-items:center;background:#e8eede;border-radius:50%;font-size:37px;margin:70px auto 23px}.endTitle{text-align:center;font-size:25px;letter-spacing:-.05em;margin:0}.endSub{text-align:center;line-height:1.8;font-size:13px;color:#82746b;margin:10px 0 35px}.endActivity{border:1px solid #eae3d9;border-radius:14px;background:#fffdf9;padding:21px 20px;margin-bottom:25px}.endActivity h3{font-size:16px;margin:0 0 9px}.endActivity p{font-size:13px;line-height:1.9;color:#7d7064;margin:0}.status{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#40372d;color:white;font-size:12px;border-radius:99px;padding:10px 16px;z-index:90;max-width:88vw;text-align:center;box-shadow:0 4px 16px #2820152e}.hidden{display:none!important}
@media(max-width:345px){.page{padding-left:13px;padding-right:13px}.reading{padding-left:11px;padding-right:11px}.tool{padding:9px 12px}.textPanel{min-height:64px}.readerTools{gap:5px}.readMode{margin-bottom:8px}}@media(min-width:740px){.shell{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:23px;overflow:hidden}.page{min-height:calc(100dvh - 56px)}.reading{max-height:860px}}
</style>
</head>
<body>
<div class="shell" id="app" aria-live="off"></div><div class="status hidden" id="toast" role="status"></div>
<script>
(() => {
 'use strict';
 const SOURCE='https://storybookscanada.ca/stories/en/0087/';
 const ORIGINAL='https://www.africanstorybook.org/';
 const COMPARE='https://vanesacoding.github.io/say-it-today/';
 const LICENSE='https://creativecommons.org/licenses/by/3.0/';
 const key='jigu-vertical-book-0087-v1';
 const data={name:'I Like to Read!',zhName:'我喜欢看书',stage:'S1 · 入门共读',level:'African Storybook Level 1',pages:[
  {en:'I like to read.',zh:'我喜欢看书。',tip:'指着男孩手里的书，可以问一句：Where is the book? 孩子可以直接指给你看。'},
  {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'和孩子一起猜一猜：男孩会去找谁一起听故事？不需要回答英文。'},
  {en:'My sister is asleep.',zh:'小妹妹正在熟睡。',tip:'指指睡着的小妹妹，轻声说 asleep（睡着了），和宝宝做一个安静的动作。'},
  {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'重复这句已经听过的问题，让孩子看看男孩接下来走向哪里。'},
  {en:'My mother and grandmother are busy.',zh:'妈妈和奶奶正在忙。',tip:'找一找画面中的妈妈和奶奶。可以用 busy（正忙着）描述做饭的场景。'},
  {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'这一次先停一下，看孩子能不能猜到男孩还会去找谁。'},
  {en:'My father and grandfather are busy.',zh:'爸爸和爷爷正在忙。',tip:'看看爸爸和爷爷在忙什么，再和孩子找一找画面里的车。'},
  {en:'Who can I read to? I can read to myself!',zh:'我可以念给谁听呢？我可以念给自己听！',tip:'男孩终于找到读书的办法啦！可以和孩子一起拿一本喜欢的书，试着自己翻一页。'}
 ]};
 const state={view:'home',page:0,readMode:'together',saved:false,finished:false,opened:false,sheet:null};
 try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old==='object'){state.page=Number.isInteger(old.page)?Math.min(7,Math.max(0,old.page)):0;state.saved=!!old.saved;state.finished=!!old.finished;state.opened=!!old.opened;}}catch(_){}
 let audioId=0,active=false,utterance=null,toastTimer=null;
 const $=id=>document.getElementById(id);
 const imageRoot=location.protocol==='file:'?'https://raw.githubusercontent.com/global-asp/asp-imagebank/master/medium/0087/':'./images/';
 const img=i=>imageRoot+String(i+2).padStart(2,'0')+'.jpg';
 function persist(){try{localStorage.setItem(key,JSON.stringify({page:state.page,saved:state.saved,finished:state.finished,opened:state.opened}))}catch(_){}}
 function notice(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2400)}
 function stop(){audioId++;active=false;utterance=null;if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(_){}}
 function speech(t,autoNext=false){if(!('speechSynthesis'in window)){notice('这台设备不支持朗读，请直接共读');return}stop();if(!t){if(autoNext)next(true);return}const token=audioId;try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.83;u.pitch=1;const list=speechSynthesis.getVoices();u.voice=list.find(v=>/^en[-_]US/i.test(v.lang))||list.find(v=>v.lang?.toLowerCase().startsWith('en'))||null;utterance=u;active=true;u.onend=()=>{if(token!==audioId)return;active=false;if(autoNext&&state.readMode==='listen'){if(state.page<7){state.page++;persist();render();speech(data.pages[state.page].en,true)}else{notice('故事听完啦，点“读完啦”结束')}}else render()};u.onerror=()=>{if(token!==audioId)return;active=false;render();notice('设备语音不可用，可尝试一起读')};speechSynthesis.speak(u)}catch(_){active=false;notice('播放失败，可以手动朗读')}render()}
 function next(automatic=false){stop();if(state.page<7){state.page++;persist();render();if(automatic&&state.readMode==='listen')speech(data.pages[state.page].en,true)}else{state.view='done';state.finished=true;persist();render()}}
 function prev(){stop();if(state.page>0){state.page--;persist();render()}}
 function go(view){stop();state.view=view;state.sheet=null;if(view==='reader')state.opened=true;persist();render()}
 function cover(){return `<img src="${img(0)}" alt="我喜欢看书：男孩坐在椅子上读书" loading="eager">`}
 function header(title){return `<header class="simpleHead"><span class="brand">叽咕一下 <small>JIGU</small></span><button class="textBtn" data-action="${title==='home'?'credits':'compare'}">${title==='home'?'原书来源':'对比横屏版 ↗'}</button></header>`}
 function home(){return `<main class="page">${header('home')}<div class="homeTitle">今天读这本</div><section class="bookEntry"><div class="entryImage">${cover()}</div><div class="entryBody"><div class="metadata">${data.stage} · 8页 · 原书 Level 1</div><h1>${data.name}</h1><p>${data.zhName}</p><button class="primary" data-go="reader">${state.opened?'继续阅读':'开始共读'} →</button></div></section><button class="mutedLink" data-action="prep">妈妈先看一眼 · 30秒</button><div class="spacer"></div><div class="foot">竖屏阅读样板 · 保留原书插画与英文<br>此样板与现有横屏版独立</div></main>`}
 function reader(){let p=data.pages[state.page],percent=(state.page+1)/8*100;return `<main class="page reading"><header class="readerHeader"><button class="iconBtn" data-go="home" aria-label="回到首页">‹</button><div class="heading">I Like to Read! <small>${state.page+1}/8</small></div><button class="iconBtn ${state.saved?'heartActive':''}" data-action="favorite" aria-label="${state.saved?'取消收藏':'收藏这本书'}">${state.saved?'♥':'♡'}</button></header><div class="stepProgress"><div style="width:${percent}%"></div></div><div class="readMode"><div class="segment"><button data-action="together" class="${state.readMode==='together'?'active':''}">一起读</button><button data-action="listen" class="${state.readMode==='listen'?'active':''}">听故事</button></div><div class="pageCount">${state.page+1} / 8</div></div><div id="artFrame" class="artFrame" aria-label="第${state.page+1}页插画，左右轻扫可翻页"><div class="imgLoading">原画加载中…</div><img src="${img(state.page)}" alt="第${state.page+1}页原书插画" draggable="false" onload="this.parentElement.classList.add('loaded')" onerror="this.previousElementSibling.textContent='插画加载失败，请刷新页面'" /></div><div class="textPanel"><h1 class="readEnglish">${p.en}</h1></div><div class="readerTools"><button class="tool listen" data-action="speak">${active?'■ 停止朗读':'▶ 听英文'}</button><button class="tool" data-action="translation">中文</button><button class="tool" data-action="tip">陪读提示</button></div><div class="pageControls"><button class="prev" data-action="prev" ${state.page===0?'disabled':''}>← 上一页</button><button class="next" data-action="next">${state.page===7?'读完啦 ✓':'下一页 →'}</button></div><p class="gestureHint">轻扫画面翻页 · 原版插画完整显示</p></main>`}
 function done(){return `<main class="page"><div class="simpleHead"><button class="iconBtn" data-go="home" aria-label="返回首页">‹</button><span class="tiny">共读记录已保存</span></div><div class="endGraphic">☘</div><h1 class="endTitle">今天读完啦</h1><p class="endSub">《I Like to Read!》<br>喜欢的话，明天也可以再读一遍。</p><div class="endActivity"><h3>放下手机，继续读</h3><p>和孩子找一本家里的小书，轮流翻一翻。可以试着说一句：I like to read. 不用打卡，也不用证明完成。</p></div><div class="spacer"></div><button class="primary" data-action="again">再读一遍</button><button class="mutedLink" data-go="home">返回今天</button></main>`}
 function sheet(){if(!state.sheet)return '';let title='',body='';const p=data.pages[state.page];if(state.sheet==='translation'){title='中文理解';body=`<p class="sheetText">${p.zh}</p>`}if(state.sheet==='tip'){title='妈妈陪读小抄';body=`<p class="sheetText">${p.tip}</p><p class="sheetSub">互动不要求孩子正确回答，用指一指、看一看或中文回应都可以。</p>`}if(state.sheet==='prep'){title='妈妈先准备';body='<p class="sheetText" style="font-family:Georgia,serif;font-weight:700">Who can I read to?</p><p class="sheetSub">我可以念给谁听呢？</p><p class="sheetSub">这是故事里反复出现的一句话。读的时候，可以让孩子猜猜男孩下一步会找谁。</p><button class="secondary" data-action="prep-audio">▶ 听这句话</button>'}if(state.sheet==='credits'){title='原书与版权';body=`<div class="credit">原作：《I Like to Read!》<br>文字：Letta Machoga<br>插画：Wiehan de Jager<br>中文译者：dohliam（沿用公开中译版本）<br>来源：African Storybook / Storybooks Canada<br>原书图文许可：<a href="${LICENSE}" target="_blank" rel="noopener noreferrer">CC BY 3.0</a><br>课程编排与陪读提示：叽咕新增，非原出版方提供。<br><a href="${SOURCE}" target="_blank" rel="noopener noreferrer">阅读公开英文原书 ↗</a><br><a href="https://englishstorybooks.org/stories/zh/0087/" target="_blank" rel="noopener noreferrer">中文版本 ↗</a><br><a href="${ORIGINAL}" target="_blank" rel="noopener noreferrer">African Storybook ↗</a><br>此样板非出版方官方App，不代表出版方为叽咕背书。朗读目前为设备合成语音，并非原出版方音频。</div>`}return `<div class="sheetScrim" data-action="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheetHead"><span>${title}</span><button class="iconBtn" data-action="close" aria-label="关闭">×</button></div>${body}</div></div>`}
 function render(){const html=state.view==='reader'?reader():state.view==='done'?done():home();$('app').innerHTML=html+sheet();persist()}
 function renderSheet(){const old=document.querySelector('.sheetScrim');if(old)old.remove();if(state.sheet)$('app').insertAdjacentHTML('beforeend',sheet())}
 document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-go]');if(!el)return;const a=el.dataset.action;if(a==='close'&&e.target.closest('.sheet')&&!e.target.closest('[data-action="close"]'))return;if(el.dataset.go){go(el.dataset.go);return}if(a==='compare'){window.open(COMPARE,'_blank','noopener,noreferrer');return}if(a==='favorite'){state.saved=!state.saved;render();notice(state.saved?'已加入收藏':'已取消收藏');return}if(a==='prev'){prev();return}if(a==='next'){next();return}if(a==='together'){stop();state.readMode='together';render();return}if(a==='listen'){state.readMode='listen';speech(data.pages[state.page].en,true);return}if(a==='speak'){if(active){stop();render()}else{speech(data.pages[state.page].en,state.readMode==='listen')}return}if(a==='again'){stop();state.page=0;go('reader');return}if(a==='prep-audio'){speech('Who can I read to?');return}if(['translation','tip','prep','credits'].includes(a)){state.sheet=a;renderSheet();return}if(a==='close'){state.sheet=null;renderSheet();return}});
 let swipe=null;document.addEventListener('touchstart',e=>{const art=e.target.closest('#artFrame');swipe=art?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});document.addEventListener('touchend',e=>{if(!swipe||state.view!=='reader')return;const dx=e.changedTouches[0].clientX-swipe.x,dy=e.changedTouches[0].clientY-swipe.y;swipe=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){dx<0?next():prev()}},{passive:true});
 window.addEventListener('keydown',e=>{if(state.sheet){if(e.key==='Escape'){state.sheet=null;renderSheet()}return}if(state.view==='reader'){if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next()}});
 window.addEventListener('pagehide',()=>stop());
 render();
})();
</script>
</body>
</html>
