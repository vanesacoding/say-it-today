name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch licensed English human narration (CC BY 3.0)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/books/read/audio
          for page in $(seq 1 8); do
            upstream=$(printf "%02d" "$((page+1))")
            localpage=$(printf "%02d" "$page")
            url="https://globalstorybooks.net/media/audio/en/0087/mp3/${upstream}.mp3"
            target="public/books/read/audio/${localpage}.mp3"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 45 "$url" -o "$target"
            file -b "$target" | grep -Eiq "audio|mpeg|mp3|id3" || (echo "::error::Invalid MP3" && exit 1)
            test $(wc -c < "$target") -gt 600
            echo "Narration file ${target}: $(wc -c < "$target") bytes"
          done
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE_PATH: /say-it-today/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
