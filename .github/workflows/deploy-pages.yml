name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.2.8
      - uses: actions/cache@v4
        with:
          path: public/audio
          key: jenny-v1-${{ hashFiles('src/data/vocabulary.json', 'src/data/sentences.json', 'src/data/advanced-sentences.json', 'scripts/generate-audio.py') }}
          restore-keys: jenny-v1-
      - run: npm run audio:generate
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE_PATH: /say-it-today/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
