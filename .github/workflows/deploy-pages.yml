name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the most recent successful media bundle
        id: previous
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch: 'main', status: 'success', per_page: 30
            });
            const names = new Set(['Deploy GitHub Pages', 'Charlie B narration release', 'Mobile reading release', 'Library 50 book release']);
            const run = result.data.workflow_runs.find(r => names.has(r.name));
            if (run) core.setOutput('run_id', run.id.toString());
      - name: Restore the previous published media bundle
        if: steps.previous.outputs.run_id != ''
        id: media
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .reading-cache
      - name: Reuse media before validating the current catalogue
        if: steps.media.outcome == 'success'
        run: |
          tar -xf .reading-cache/artifact.tar -C .reading-cache
          if [ -d .reading-cache/books/library ]; then
            mkdir -p public/books
            cp -a .reading-cache/books/library public/books/
          fi
      - name: Fetch declared book images and verified narration
        run: python3 scripts/fetch-reading-library.py
      - run: npm run check
      - run: npm run build
        env:
          VITE_BASE_PATH: /say-it-today/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
