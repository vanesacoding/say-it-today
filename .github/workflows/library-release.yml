name: Reviewed reading library release

on:
  push:
    branches: [main]
    paths: [scripts/library-release-request.json]
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Restore a fully completed recording artifact without synthesis
        required: false
        type: string
      continue_unsubmitted:
        description: Continue only never-submitted pages from a verified partial checkpoint
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reviewed-reading-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install PyMuPDF==1.26.6 Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg python3-pil
      - run: npm ci
      - name: Validate fixed per-book voices and source before any synthesis
        run: python3 scripts/library-release-production.py --dry-run && python3 scripts/check-library-release-plan.py && python3 scripts/check-nature-sources.py
      - name: Find the latest published media bundle
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo, branch: 'main', status: 'success', per_page: 30
            });
            const names = new Set(['Deploy GitHub Pages', 'Library 50 book release', 'Reviewed reading library release']);
            const run = result.data.workflow_runs.find(r => names.has(r.name));
            if (!run) throw new Error('No validated media baseline found');
            core.setOutput('run_id', run.id.toString());
      - name: Restore previously published media before synthesis
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .reading-audio/media-baseline
      - run: tar -xf .reading-audio/media-baseline/artifact.tar -C public ./books/library
      - name: Read pinned recording recovery
        id: resume
        run: |
          python3 - <<'PYCODE'
          import json,os
          run=str(json.load(open('scripts/library-release-request.json')).get('resumeRunId',''))
          if run and not run.isdecimal():raise ValueError('Invalid recovery run')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('run_id='+run+'\n')
          PYCODE
      - name: Restore completed audio when resuming
        if: (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '') || steps.resume.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: jigu-library-release-audio
          run-id: ${{ inputs.resume_run_id || steps.resume.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .reading-audio/library-release
      - name: Generate only changed pages or verify saved recordings
        env:
          DOUBAO_SPEECH_API_KEY: ${{ secrets.DOUBAO_SPEECH_API_KEY }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id || steps.resume.outputs.run_id }}
          CONTINUE_UNSUBMITTED: ${{ inputs.continue_unsubmitted }}
        run: |
          if [ -n "$RESUME_RUN_ID" ]; then
            if [ "$CONTINUE_UNSUBMITTED" = "true" ]; then
              python3 scripts/library-release-production.py --continue-unsubmitted
            else
              python3 scripts/library-release-production.py --resume-only
            fi
          else
            python3 scripts/library-release-production.py
          fi
      - name: Save full or partial recording checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jigu-library-release-audio
          path: .reading-audio/library-release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - run: python3 scripts/fetch-reading-library.py
      - run: python3 scripts/check-mobile-media.py
      - run: npm run check
        env:
          CI: '1'
      - run: npm run build
        env:
          VITE_BASE_PATH: /say-it-today/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Check main and source catalogue before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-reading-catalog.py --batch library-release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90
      - name: Publish verified reading library
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Persist the verified catalogue for future deployments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-reading-catalog.py --batch library-release --commit
