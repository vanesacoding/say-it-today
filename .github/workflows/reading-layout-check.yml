name: Reading navigation layout
on:
  pull_request:
    paths: [index.html, scripts/check-animal-books.mjs, scripts/check-animal-layout.mjs, scripts/library-release-books-animals.json, public/books/curation.js, scripts/check-vocabulary.mjs, scripts/check-vocabulary-swipe-layout.mjs, scripts/check-phone-books.mjs, scripts/check-phone-layout.mjs, scripts/library-release-books-phone.json, scripts/library-release-books-letsread.json, scripts/check-letsread.mjs, scripts/check-letsread-layout.mjs, .github/workflows/reading-layout-check.yml]
  push:
    branches: [main]
    paths: [index.html, scripts/check-animal-books.mjs, scripts/check-animal-layout.mjs, scripts/library-release-books-animals.json, public/books/curation.js, scripts/check-vocabulary.mjs, scripts/check-vocabulary-swipe-layout.mjs, scripts/check-phone-books.mjs, scripts/check-phone-layout.mjs, scripts/library-release-books-phone.json, scripts/library-release-books-letsread.json, scripts/check-letsread.mjs, scripts/check-letsread-layout.mjs, .github/workflows/reading-layout-check.yml]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check app without downloading media
        run: npm run check
        env:
          CI: ''
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify navigation stays in the viewport while scrolling
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/jigu-layout-server.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import {mkdirSync} from 'node:fs';
          mkdirSync('layout-proof',{recursive:true});
          import assert from 'node:assert/strict';
          const browser=await chromium.launch();
          try {
            for(const [width,height] of [[320,568],[390,844],[430,932],[1024,768]]) {
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('http://127.0.0.1:4173/');
              for(const view of ['home','shelf','mine']) {
                await page.locator('.bottomNav [data-go="'+view+'"]').click();
                if(view==='shelf') {
                  const rail=await page.locator('.themeFilters').evaluate(el=>{
                    const boxes=[...el.querySelectorAll('button')].map(b=>b.getBoundingClientRect());
                    return {tops:boxes.map(b=>Math.round(b.top)),heights:boxes.map(b=>b.height),scrollWidth:el.scrollWidth,width:el.clientWidth,overflow:getComputedStyle(el).overflowX,pageWidth:document.documentElement.scrollWidth,viewport:window.innerWidth};
                  });
                  assert.equal(new Set(rail.tops).size,1,'themes must stay on one line');
                  assert.ok(rail.heights.every(h=>h>=44),'theme touch targets');
                  assert.equal(rail.overflow,'auto');
                  assert.ok(rail.pageWidth<=rail.viewport,'no page-level horizontal overflow');
                  if(width===320)assert.ok(rail.scrollWidth>rail.width,'narrow screens scroll themes');
                  await page.getByLabel('选择共读阶段').click();await page.getByRole('radio',{name:'短句共读',exact:true}).click();
                  await page.getByRole('button',{name:'心情与朋友',exact:true}).click();
                  assert.equal(await page.getByLabel('选择共读阶段').getAttribute('value'),'S2');
                  assert.ok(await page.locator('.shelfCard').count()>0);
                  assert.ok((await page.locator('.shelfCard .cardStage').allTextContents()).every(t=>t.startsWith('短句共读')));
                  await page.getByLabel('选择共读阶段').click();
                  const picker=await page.locator('.sheetStagePicker').evaluate(el=>({background:getComputedStyle(el).backgroundColor,fonts:[...el.querySelectorAll('.stageOption')].map(e=>parseFloat(getComputedStyle(e).fontSize)),rows:el.querySelectorAll('input[type=radio]').length}));
                  assert.equal(picker.background,'rgb(250, 247, 241)');assert.equal(picker.rows,4);assert.ok(picker.fonts.every(n=>n<=13));
                  if(width===390)await page.screenshot({path:'layout-proof/stage-picker-390.png'});
                  await page.getByRole('button',{name:'关闭',exact:true}).click();
                  await page.getByRole('button',{name:'阶段说明',exact:true}).click();
                  assert.ok(await page.getByRole('dialog',{name:'共读阶段怎么选'}).isVisible());
                  const guide=await page.locator('.sheetStages').evaluate(el=>({width:el.getBoundingClientRect().width,rows:[...el.querySelectorAll('.stageGuideRow')].map(r=>({title:parseFloat(getComputedStyle(r.querySelector('dt')).fontSize),text:parseFloat(getComputedStyle(r.querySelector('dd')).fontSize)}))}));
                  assert.equal(guide.rows.length,3);assert.ok(guide.rows.every(r=>r.title<=14&&r.text<=12));assert.ok(guide.width<=width);
                  if(width===390)await page.screenshot({path:'layout-proof/stage-guide-390.png'});
                  await page.getByRole('button',{name:'关闭',exact:true}).click();
                  await page.reload();
                  await page.locator('.bottomNav [data-go="shelf"]').click();
                  assert.equal(await page.getByLabel('选择共读阶段').getAttribute('value'),'all');
                  assert.equal(await page.getByRole('button',{name:'全部',exact:true}).getAttribute('aria-pressed'),'true');
                  assert.equal(await page.locator('[data-book="0130"],[data-book="0344"]').count(),0);
                  for(const [topic,label] of [['everyday','日常生活'],['nature','动物与自然'],['discovery','颜色与发现'],['feelings','心情与朋友']]){
                    await page.locator('[data-filter-theme="'+topic+'"]').click();
                    const labels=await page.locator('.shelfCard .cardStage').allTextContents();assert.ok(labels.length>0&&labels.every(t=>t.endsWith(label)),JSON.stringify({topic,labels}));
                  }
                  assert.equal(await page.locator('[data-book="0130"],[data-book="0344"]').count(),0);
                  if(width===390)await page.screenshot({path:'layout-proof/feelings-shelf-390.png'});
                  await page.getByRole('button',{name:'全部',exact:true}).click();
                  const chips=await page.locator('.themeFilters button').evaluateAll(buttons=>buttons.map(b=>({touch:b.getBoundingClientRect().height,visual:b.querySelector('span').getBoundingClientRect().height,shadow:getComputedStyle(b).boxShadow})));
                  assert.ok(chips.every(c=>c.touch>=44&&c.visual<36&&c.shadow==='none'));
                  assert.ok(!/原版真人朗读|AI英文配音|设备英语朗读/.test(await page.locator('main').textContent()));
                  await page.getByLabel('选择共读阶段').click();await page.getByRole('radio',{name:'全部阶段',exact:true}).click();
                  await page.getByRole('button',{name:'全部',exact:true}).click();
                }
                for(const end of [false,true]) {
                  await page.evaluate(end=>window.scrollTo(0,end?document.documentElement.scrollHeight:0),end);
                  const result=await page.locator('.bottomNav').evaluate(nav=>{
                    const rect=nav.getBoundingClientRect(),main=nav.closest('.page');
                    return {top:rect.top,bottom:rect.bottom,height:rect.height,width:rect.width,position:getComputedStyle(nav).position,padding:parseFloat(getComputedStyle(main).paddingBottom),buttons:[...nav.querySelectorAll('button')].map(b=>b.getBoundingClientRect().height)};
                  });
                  assert.equal(result.position,'fixed');
                  assert.ok(Math.abs(result.bottom-height)<2,JSON.stringify({width,height,view,end,result}));
                  assert.ok(result.top>=0&&result.width<=460&&result.padding>=result.height);
                  assert.ok(result.buttons.every(h=>h>=44));
                }
              }
              await page.locator('.bottomNav [data-go="shelf"]').click();
              await page.locator('[data-book="0087"]').click();
              await page.locator('[data-go="reader"]').click();
              await page.locator('[data-action="companion"]').click();
              for(const end of [false,true]) {
                await page.evaluate(end=>window.scrollTo(0,end?document.documentElement.scrollHeight:0),end);
                const header=await page.locator('.readerHeader').evaluate(el=>{const r=el.getBoundingClientRect();return {top:r.top,bottom:r.bottom,height:r.height,position:getComputedStyle(el).position,title:el.querySelector('.heading').textContent}});
                assert.equal(header.position,'sticky');assert.ok(header.top>=-1&&header.top<=(end?1:29),JSON.stringify({width,height,end,header}));assert.ok(header.height>=54&&header.bottom<height);assert.ok(header.title.includes('I like to read!'));
              }
              await page.close();
            }
            console.log('PASS fixed navigation: home/shelf/mine, 4 viewports, top and bottom scroll positions');
          } finally { await browser.close(); }
          JS

      - name: Verify complete candidate mobile books
        run: python3 scripts/prepare-phone-layout.py && node scripts/check-animal-layout.mjs && node scripts/check-phone-layout.mjs && node scripts/check-letsread-layout.mjs && node scripts/check-vocabulary-swipe-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-book-layout-proof
          path: layout-proof/
          retention-days: 14
