name: Reading navigation layout
on:
  pull_request:
    paths: [scripts/check-large-reader.mjs, scripts/check-large-reader-layout.mjs, scripts/prepare-phone-layout.py, index.html, scripts/check-home-profile.mjs, scripts/check-home-layout.mjs, scripts/check-nature-books.mjs, scripts/check-nature-layout.mjs, scripts/check-nature-sources.py, scripts/pdf-source-assets.py, scripts/nature-source-manifest.json, scripts/library-release-books-nature.json, scripts/check-shelf-search.mjs, scripts/check-animal-books.mjs, scripts/check-animal-layout.mjs, scripts/library-release-books-animals.json, public/books/curation.js, scripts/check-vocabulary.mjs, scripts/check-vocabulary-swipe-layout.mjs, scripts/check-phone-books.mjs, scripts/check-phone-layout.mjs, scripts/library-release-books-phone.json, scripts/library-release-books-letsread.json, scripts/check-letsread.mjs, scripts/check-letsread-layout.mjs, .github/workflows/reading-layout-check.yml]
  push:
    branches: [main]
    paths: [scripts/check-large-reader.mjs, scripts/check-large-reader-layout.mjs, scripts/prepare-phone-layout.py, index.html, scripts/check-home-profile.mjs, scripts/check-home-layout.mjs, scripts/check-nature-books.mjs, scripts/check-nature-layout.mjs, scripts/check-nature-sources.py, scripts/pdf-source-assets.py, scripts/nature-source-manifest.json, scripts/library-release-books-nature.json, scripts/check-shelf-search.mjs, scripts/check-animal-books.mjs, scripts/check-animal-layout.mjs, scripts/library-release-books-animals.json, public/books/curation.js, scripts/check-vocabulary.mjs, scripts/check-vocabulary-swipe-layout.mjs, scripts/check-phone-books.mjs, scripts/check-phone-layout.mjs, scripts/library-release-books-phone.json, scripts/library-release-books-letsread.json, scripts/check-letsread.mjs, scripts/check-letsread-layout.mjs, .github/workflows/reading-layout-check.yml]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MP3 slicing tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install PyMuPDF==1.26.6 Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check app without downloading media
        run: npm run check
        env:
          CI: ''
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify current GK library
        run: node scripts/check-gk-online.mjs
