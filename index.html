<script>
const SRC='https://bookdash.github.io/bookdash-books/come-back-cat/en/';
const COVER='./books/cat/cover.jpg';
const STORY=[
{scene:'小猫躲在沙发底下。',eng:'Where is the little cat?',prompt:'让孩子先找一找：小猫躲在哪里？指到就算参与。',word:'cat',fallback:'沙发下面的小猫'},
{scene:'小猫一下爬到了窗帘上。',eng:'Look up! The cat is climbing.',prompt:'可以用手指向画面上方，问孩子有没有找到小猫。不要让孩子模仿攀爬窗帘。',word:'up',fallback:'爬上窗帘的小猫'},
{scene:'小猫坐在篮子里，看上去不太情愿。',eng:'Does the cat look happy?',prompt:'和孩子一起看看小猫的表情。可以问“开心还是不开心？”不必用英语回答。',word:'basket',fallback:'篮子里气鼓鼓的小猫'},
{scene:'它又悄悄溜向门口。',eng:'Oh! The cat is going out.',prompt:'让孩子观察门的位置，并试着说说小猫要去哪里。',word:'door',fallback:'从门边溜走的小猫'},
{scene:'来到花园，小猫追起了蝴蝶。',eng:'Can you spot a butterfly?',prompt:'指一只蝴蝶，再让孩子自己找第二只。',word:'butterfly',fallback:'花园里的蝴蝶'},
{scene:'小猫扯下一只袜子，细线缠住尾巴。',eng:'What has the cat found?',prompt:'找一找：袜子在哪里？细线在哪里？先观察，不要求复述。',word:'sock',fallback:'叼走袜子的小猫'},
{scene:'小猫又遇见一只小蜗牛。',eng:'Can you find the snail?',prompt:'鼓励孩子注意画面里的小细节，而不是只看小猫。',word:'snail',fallback:'遇到蜗牛的小猫'},
{scene:'小猫来到了小鸡身边。',eng:'What do you think happens next?',prompt:'停一停，让孩子猜一猜下一页会发生什么。可以用中文说。',word:'chicken',fallback:'和小鸡相遇的小猫'},
{scene:'鸡毛飞得到处都是。',eng:'Look at all those feathers!',prompt:'一起找飞起来的羽毛。重点是观察，不必进行正确性测试。',word:'feather',fallback:'飞散的羽毛'},
{scene:'小猫回到了篮子，看起来准备休息。',eng:'Is it time to rest?',prompt:'结合日常生活问“我们困了会做什么？”也可以做一个轻轻打哈欠的动作。',word:'nap',fallback:'回篮子的猫咪'},
{scene:'咦？篮子里怎么空了？',eng:'Where has the cat gone?',prompt:'这是一页很适合制造悬念的画面：先不翻页，让孩子猜。',word:'where',fallback:'空空的猫篮'},
{scene:'原来，小猫舒服地躺在沙发上睡着了。',eng:'Found you, little cat!',prompt:'用惊喜的语气结束故事。孩子如果想重读，欢迎直接从头再来。',word:'sleep',fallback:'沙发上睡着的小猫'}
];
const ORIGINAL=[["Come back, cat! Play with me.", "回来吧，小猫！陪我玩。"], ["Sit in your basket. Stay right here!", "坐进你的篮子里。好好待在这儿！"], ["Come back, cat! That’s way too high.", "回来，小猫！那儿太高啦。"], ["Come back, cat! Don’t go outside.", "回来，小猫！不要跑到外面去。"], ["", "这幅画原书没有文字，可以静静看图。"], ["Come back, cat! That’s not yours.", "回来，小猫！那不是你的东西。"], ["Come back, cat! What have you got?", "回来，小猫！你拿着什么呢？"], ["Come back, cat. That’s not your friend!", "回来，小猫。那可不是你的朋友！"], ["Hello, cat! Are you back?", "你好，小猫！你回来了吗？"], ["Stay in your basket. It’s nap time now.", "待在你的篮子里。现在是午睡时间啦。"], ["Cat?", "小猫？"], ["", "这幅画原书没有文字，可以看图猜猜小猫睡得怎么样。"]];
STORY.forEach((p,i)=>{p.eng=ORIGINAL[i][0];p.translation=ORIGINAL[i][1];});
const KEY='jigu_cat_readalong_alpha_v1';
let narrating=false, narrateTimer=null, activeUtterance=null;
let model={view:'home',page:0,progress:0,started:false,finished:false,bookmark:false,showCn:true,showTips:false,readMode:'together',activity:false,savedAt:null};
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)model={...model,...old,view:'home',showTips:false}}catch(e){}
function save(){model.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(model))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){return `<nav class="navbar"><button class="navbtn ${model.view==='home'?'active':''}" data-go="home"><span>☀</span>今天</button><button class="navbtn ${model.view==='library'?'active':''}" data-go="library"><span>▤</span>小书架</button><button class="navbtn ${model.view==='profile'?'active':''}" data-go="profile"><span>♡</span>我的</button></nav>`}
function head(title,where='home'){return `<div class="row toprow"><button class="topAction" data-go="${where}" aria-label="返回">‹</button><strong>${title}</strong><button class="topAction" data-go="rights" aria-label="版权和来源">ⓘ</button></div>`}
function cover(cls='bookcover'){return `<span class="coverfallback" aria-hidden="true">🐈</span><img class="${cls}" alt="Book Dash《Come Back, Cat!》英文原版封面" src="${COVER}" style="display:none" onload="this.style.display='block';this.previousElementSibling.style.display='none'" onerror="this.style.display='none'">`}

function home(){return `<section class="screen"><div class="row toprow"><div class="mark">叽咕一下 <small>JIGU</small></div><span class="chip">家长陪读版</span></div><div class="brandhero"><div class="tinycap">TODAY, A LITTLE STORY</div><h1>每天读一点，<br>一起发现小世界。</h1><p>适合妈妈先听一遍，再和孩子慢慢读。</p></div><div class="hero"><div class="heroimg"><span class="leaf a">🍃</span><span class="leaf b">🍃</span>${cover()}</div><div class="heroText"><span class="chip orange">今日推荐 · S1 看图听故事</span><div class="heroTitle">Come Back, Cat!</div><p>一只闲不住的小猫，跑出去了又跑回来。<br>跟着它，一起读一个有点调皮的小故事。</p><button class="primary full" data-go="detail">${model.started?'继续读这本书 →':'打开这本书 →'}</button></div></div><div class="littleTitle">今天还可以这样读</div><div class="tiles"><button class="tile" data-go="prep"><span class="tileIcon">🎧</span><strong>妈妈先准备</strong><span>看一句简单引导语</span></button><button class="tile" data-go="library"><span class="tileIcon">📚</span><strong>小书架</strong><span>按阶段和主题选书</span></button></div>${nav()}</section>`}
function detail(){return `<section class="screen">${head('书籍介绍')}<div class="bookhead"><div class="coverstand">${cover()}</div><span class="chip">S1 · 看图听故事</span><h1>Come Back, Cat!</h1><p>回来吧，小猫！<br>一只调皮猫咪的短篇故事</p></div><div class="detailGrid"><div><strong>12幅</strong><span>原版故事插画</span></div><div><strong>约5分钟</strong><span>家长共读建议</span></div><div><strong>不考核</strong><span>听、看、指一指</span></div></div><div class="panel"><h3>这本书为什么适合入门？</h3><p>画面连续，语言反复，孩子可以用指认、猜测和模仿表情参与。不会认字、不会说英语也没有关系。</p></div><div class="panel"><h3>妈妈可以怎么用？</h3><p>先用30秒听发音、看陪读提示；读的时候以图片为主，读到有趣的地方再停下来问一句。中文和引导语都可以按需展开。</p></div><div class="notice" style="margin-top:13px">内容来源：Book Dash (CC BY 4.0)。已按出版方原版顺序接入12幅插画和对应英文原文；中文翻译及陪读提示由叽咕添加。</div><div style="height:15px"></div><button class="primary full" data-go="prep">开始前，妈妈看30秒 →</button><div style="height:8px"></div><button class="secondary full" data-go="reader">直接开始共读</button><div class="footerlinks"><a target="_blank" rel="noopener" href="${SRC}">阅读出版方英文原版 ↗</a><a href="#" data-go="rights">创作与授权说明 ↗</a></div></section>`}
function prep(){return `<section class="screen">${head('妈妈先准备','detail')}<div class="tinycap">30 SECOND PREP</div><h1 class="title" style="margin:12px 0">不用英语很好，<br>也能开始共读。</h1><p class="subtitle">看一眼就好，正式读书时随时可以再打开。</p><div class="prepcard"><span class="cap">今天记住一个核心表达</span><div class="eng">Come back, cat!</div><div class="chn">回来吧，小猫！</div><div style="height:13px"></div><button class="secondary" data-action="speak-core">▶ 听设备示范音</button><p class="tinyNote" style="margin:9px 0 0">当前使用设备系统语音试听；人工听感验收与固定音轨待完成。</p></div><div class="step"><div class="stepno">1</div><div><strong>先看图，不急着翻译</strong><p>孩子找到小猫、注意到不同动作，就已经在参与故事。</p></div></div><div class="step"><div class="stepno">2</div><div><strong>挑一句简单问话</strong><p>Where is the cat?（小猫在哪儿？）让孩子指一指即可。</p></div></div><div class="step"><div class="stepno">3</div><div><strong>适当停下来，猜下一页</strong><p>不需要逐句讲解，也不要求孩子完整用英语回答。</p></div></div><div class="notice">小猫爬窗帘、跑到户外只是绘本情节；现实亲子活动不引导孩子模仿危险动作，也不让孩子独自追逐宠物。</div><div style="height:20px"></div><button class="primary full" data-go="reader">好，开始一起读 →</button><button class="secondary full" style="margin-top:9px" data-action="skip-prep">下次直接读（保留这份小抄）</button></section>`}
function reader(){let p=STORY[model.page],n=model.page+1;return `<section class="screen readerScreen"><div class="readerHeader"><button class="round" data-go="detail" aria-label="返回书籍介绍">‹</button><strong>Come Back, Cat! <span style="color:#b5aa9c;font-size:11px;margin-left:7px">${n} / 12</span></strong><button class="round" data-action="bookmark" aria-label="收藏">${model.bookmark?'♥':'♡'}</button></div><div class="meter"><div style="width:${100*n/12}%"></div></div><div class="seg"><button class="${model.readMode==='together'?'active':''}" data-action="mode-together">📖 一起读</button><button class="${model.readMode==='listen'?'active':''}" data-action="mode-listen">🎧 听故事</button></div><div class="pagePicture" id="picture"><div class="imageFallback"><div class="cat">🐈</div><p>第${n}幅：${esc(p.fallback)}<br><small>原版插画加载失败，请尝试刷新</small></p></div><img alt="Book Dash《Come Back, Cat!》第${n}幅插画" src="./books/cat/${String(n).padStart(2,'0')}.jpg" style="display:none" onload="this.style.display='block'" onerror="this.style.display='none'"/><span class="pageBubble">Book Dash 原图</span></div><div class="readingText"><div class="hint">Book Dash 原书英文 · CC BY 4.0</div><h2>${esc(p.eng||"这页没有原文，慢慢看图")}</h2>${model.showCn?`<div class="cn">${esc(p.translation)}</div>`:''}</div><div class="readerActions"><button class="pill" data-action="speak-page">${narrating?"■ 停止朗读": "▶ "+(model.readMode==='listen'?'从这里听故事':'听本页原文')}</button><button class="pill ${model.showCn?'selected':''}" data-action="chinese">中译 ${model.showCn?'✓':'+'}</button><button class="pill ${model.showTips?'selected':''}" data-action="tips">妈妈提示 ${model.showTips?'⌃':'⌄'}</button></div>${model.showTips?`<div class="parentPanel"><strong>给妈妈的小提示</strong><p>${esc(p.prompt)}</p><p><em>孩子可以用看、指、动作或中文来参与，不强制回答。</em></p></div>`:''}<div class="pageNav"><button class="secondary" ${model.page===0?'disabled':''} data-action="prev">← 上一页</button><button class="primary" data-action="next">${model.page===11?'读完这本书 ✓':'下一页 →'}</button></div><p class="tinyNote" style="text-align:center;margin:12px 0 0">原文与插画来自 <a target="_blank" rel="noopener" href="${SRC}">Book Dash</a> · 设备语音为试听版</p></section>`}
function finish(){return `<section class="screen">${head('读完啦','home')}<div class="doneHero"><div class="symbol">🐈✨</div><h1>今天一起读完啦！</h1><p>没有对错，也不用考试。<br>你们一起读故事，就是一次很棒的陪伴。</p><div style="margin-top:14px"><span class="chip">12幅画面 · 叽咕共读记录</span></div></div><div class="task"><div class="tinycap">CLOSE THE SCREEN, OPEN THE WORLD</div><div style="height:9px"></div><strong>放下手机 · 和毛绒玩具玩“找小猫”</strong><p>家长把一只毛绒小猫放在安全、容易找到的地方，让孩子找一找。找到时可以说一句：<b>Here it is!</b></p><div class="micro">不需要上传照片、录音或证明完成；也不要让孩子攀爬家具找玩具。</div><div style="height:12px"></div><button class="pill ${model.activity?'selected':''}" data-action="activity">${model.activity?'✓ 已记录一起玩过':'♡ 我们也玩了'}</button></div><div class="panel"><h3>妈妈带走的一句话</h3><p><b>Where is the cat?</b> — 小猫在哪里？<br>放在日常找玩具、指图互动的场景里都能用。</p></div><div style="height:20px"></div><button class="primary full" data-action="reread">再读一遍这本书 ↻</button><button class="secondary full" style="margin-top:8px" data-go="home">返回今天</button></section>`}
function library(){return `<section class="screen"><div class="row toprow"><div class="mark">小书架</div><span class="chip">按阶段 × 兴趣选书</span></div><h1 class="title" style="margin:10px 0">每个小故事，<br>都有适合它的读法。</h1><p class="subtitle">首版开放1本Book Dash授权绘本，其他书目完成内容和音频验收后再上线。</p><div class="row" style="margin:20px 0 6px"><span class="chip orange">S1 看图听故事</span><span class="tinyNote">当前1本</span></div><button class="shelfItem" data-go="detail"><div class="shelfCover" style="position:relative;overflow:hidden">${cover('bookcover')}</div><div><h3>Come Back, Cat!</h3><p>动物 · 反复句型 · 家长共读<br>${model.finished?'✓ 已经读完':'约5分钟 · 适合先从听和指认开始'}</p></div><span>›</span></button><div class="row" style="margin:24px 0 6px"><span class="chip">S2 重复句型</span><span class="tinyNote">筹备中</span></div><div class="panel"><h3>下一批候选</h3><p>A House for Mouse / The Red Raincoat。完成素材、版权和配音验收后开放。</p></div><div class="row" style="margin:24px 0 6px"><span class="chip">S3 故事理解</span><span class="tinyNote">筹备中</span></div><div class="panel"><h3>下一批候选</h3><p>The Best Thing Ever。按情节理解和家长共读负担再确认级别。</p></div>${nav()}</section>`}
function profile(){return `<section class="screen"><div class="row toprow"><div class="mark">我的</div><span class="chip">小小的共读足迹</span></div><h1 class="title" style="margin:10px 0">慢慢读，<br>不着急。</h1><div class="panel" style="margin-top:25px"><h3>共读记录</h3><p>Come Back, Cat!：${model.finished?'已读完 · 随时可以重读':model.started?`已看到第${Math.max(1,model.progress)}幅 · 可以继续`:'尚未开始'}</p><button class="secondary full" style="margin-top:14px" data-go="${model.started?'reader':'detail'}">${model.started?'继续或重读':'去看看这本书'}</button></div><div class="panel"><h3>我的收藏</h3><p>${model.bookmark?'♥ Come Back, Cat! 已收藏':'还没有收藏的绘本，遇到喜欢的可以点心形标记。'}</p></div><div class="panel"><h3>共读设置</h3><p>中文解释：${model.showCn?'显示':'隐藏'}<br>家长提示：由你决定是否展开；不强制教学。</p></div><div style="height:15px"></div><button class="secondary full" data-go="rights">来源、版权与样板说明</button>${nav()}</section>`}
function rights(){return `<section class="screen">${head('来源与版权','detail')}<h1 class="title">这本书从哪里来？</h1><p class="subtitle">让好故事被更多家庭阅读，也尊重创作者。</p><div class="panel"><h3>原始作品</h3><p>书名：Come Back, Cat!（2014，Book Dash）<br>文字：Nicola Rijsdijk<br>插画：Karen Lilje<br>设计：Sam Scarborough<br>编辑：本书线上版尚未列出姓名，待出版方进一步确认。</p></div><div class="panel"><img src="./books/cat/book-dash-logo.png" alt="Book Dash 官方标志" style="max-width:115px;max-height:54px;object-fit:contain;display:block;margin-bottom:12px" /><h3>开放授权</h3><p>原书图文采用 Creative Commons Attribution 4.0 International（CC BY 4.0），允许在满足署名等条件时复制、翻译和改编。<br>原始图文版权归原创作者；叽咕没有取得该作品的独占版权，也不代表 Book Dash 为叽咕背书。</p><div class="footerlinks"><a target="_blank" rel="noopener" href="https://bookdash.org/books/come-back-cat/">原书</a><a target="_blank" rel="noopener" href="https://creativecommons.org/licenses/by/4.0/">授权条款</a><a target="_blank" rel="noopener" href="https://bookdash.org/re-using-the-book-dash-content/">官方署名规范</a></div></div><div class="panel"><h3>叽咕提供的内容</h3><p>中文版翻译、家长提示、活动建议、阅读记录与交互界面由叽咕新增。原始英文正文和插画来自Book Dash；本版使用浏览器系统英语语音进行测试，非出版方原版有声书。</p></div><div class="notice" style="margin-top:14px">版权待核验项：Book Dash本书编辑姓名。英语朗读现为设备合成语音，需真机试听后更换为经过审核的固定音轨。图片已作为开放授权素材复制到本项目，并保留原版权来源。</div><div style="height:16px"></div><button class="primary full" data-go="detail">返回绘本介绍</button></section>`}
function render(scroll=true){const content=({home,detail,prep,reader,finish,library,profile,rights})[model.view]?.()||home();document.getElementById('app').innerHTML=content;if(scroll){const el=document.querySelector('.screen');if(el)el.scrollTop=0;}save()}
let toasty;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toasty);toasty=setTimeout(()=>el.classList.remove('show'),3000)}
function stopNarration(){narrating=false;activeUtterance=null;if(narrateTimer){clearTimeout(narrateTimer);narrateTimer=null;}if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){}}
function voiceForEnglish(){let vs=speechSynthesis.getVoices();return vs.find(v=>/^en[-_]US/i.test(v.lang)&&!v.localService)||vs.find(v=>v.lang.toLowerCase().startsWith('en-'))||vs.find(v=>v.lang.toLowerCase().startsWith('en'))||null}
function speak(text,after){if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音播放，可手动读原文');return;}if(!text){if(after)narrateTimer=setTimeout(after,1800);return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);activeUtterance=u;u.lang='en-US';u.rate=.82;u.pitch=1;const v=voiceForEnglish();if(v)u.voice=v;u.onend=()=>{if(narrating&&activeUtterance===u&&after)after()};u.onerror=()=>{narrating=false;toast('设备语音播放失败，请尝试一起读')};speechSynthesis.speak(u);}catch(e){narrating=false;toast('设备语音暂不可用，试着自己读故事')}}
function playPageNarration(){if(model.view!=='reader'||!narrating)return;const pageAtStart=model.page;const text=STORY[pageAtStart].eng;speak(text,()=>{if(!narrating||model.view!=='reader'||model.page!==pageAtStart)return;if(pageAtStart===STORY.length-1){narrating=false;render(false);toast('故事读完啦！可以点下面的完成按钮')}else{model.page++;model.progress=Math.max(model.progress,model.page+1);render(false);narrateTimer=setTimeout(playPageNarration,450)}})}
function startNarration(){stopNarration();narrating=true;render(false);playPageNarration()}

function go(view){stopNarration();model.view=view;if(view==='reader'){model.started=true;model.progress=Math.max(model.progress,model.page+1);}render()}
document.getElementById('phone').addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-action]');if(!el)return;e.preventDefault();if(el.dataset.go){go(el.dataset.go);return;}const act=el.dataset.action;const old=model.view;
switch(act){case 'bookmark':model.bookmark=!model.bookmark;toast(model.bookmark?'已加入收藏':'已取消收藏');break;
case 'chinese':model.showCn=!model.showCn;break;
case 'tips':model.showTips=!model.showTips;break;
case 'mode-together':stopNarration();model.readMode='together';break;
case 'mode-listen':model.readMode='listen';startNarration();return;
case 'speak-core':stopNarration();speak('Come back, cat!');toast('播放设备语音 · 正式配音待人工试听');return;
case 'speak-page':if(narrating){stopNarration();render(false)}else{startNarration()}return;
case 'skip-prep':model.view='reader';model.started=true;break;
case 'prev':stopNarration();model.page=Math.max(0,model.page-1);break;
case 'next':stopNarration();if(model.page===STORY.length-1){model.view='finish';model.finished=true;model.progress=STORY.length}else{model.page++;model.progress=Math.max(model.progress,model.page+1)}break;
case 'reread':stopNarration();model.page=0;model.view='reader';model.started=true;break;
case 'activity':model.activity=!model.activity;break;
}render(old!=='reader'||model.view!=='reader')});
window.addEventListener('keydown',e=>{if(model.view!=='reader')return;if(e.key==='ArrowRight'){e.preventDefault();document.querySelector('[data-action="next"]')?.click()}if(e.key==='ArrowLeft'){e.preventDefault();document.querySelector('[data-action="prev"]')?.click()}});
let touchX=0;document.getElementById('phone').addEventListener('touchstart',e=>{if(model.view==='reader')touchX=e.touches[0].clientX},{passive:true});document.getElementById('phone').addEventListener('touchend',e=>{if(model.view!=='reader'||!touchX)return;const dx=e.changedTouches[0].clientX-touchX;touchX=0;if(Math.abs(dx)>80){const sel=dx<0?'next':'prev';document.querySelector(`[data-action="${sel}"]`)?.click()}},{passive:true});
render();
</script>
</body>
