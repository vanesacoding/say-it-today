</style></head><body><div class="shell" id="app" aria-live="off"></div><div class="status hidden" id="toast" role="status"></div><script src="./books/catalog.js"></script><script>
(() => {
  'use strict';
  const books=window.JIGU_BOOKS;
  const STORAGE_KEY='jigu-reading-library-v2';
  const LEGACY_KEY='jigu-vertical-book-0087-v1';
  const themes=[{id:'everyday',label:'我的每一天'},{id:'nature',label:'动物与自然'},{id:'discovery',label:'颜色与发现'},{id:'feelings',label:'情绪与朋友'}];
  const stages=[{id:'S1',label:'看图听故事'},{id:'S2',label:'重复句型'},{id:'S3',label:'简单故事理解'}];
  const state={view:'home',readMode:'together',companionMode:false,sheet:null,wordId:null,themeFilter:'all',stageFilter:'all',records:{}};
  let selectedId='0087';
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved&&typeof saved==='object'){
      state.records=saved.records&&typeof saved.records==='object'&&!Array.isArray(saved.records)?saved.records:{};
      state.companionMode=!!saved.companionMode;
      if(books.some(b=>b.id===saved.selectedId))selectedId=saved.selectedId;
      if(themes.some(t=>t.id===saved.themeFilter))state.themeFilter=saved.themeFilter;
      if(stages.some(s=>s.id===saved.stageFilter))state.stageFilter=saved.stageFilter;
    }else{
      const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');
      if(old&&typeof old==='object'){
        state.records['0087']={page:old.page,saved:!!old.saved,finished:!!old.finished,opened:!!old.opened};
        state.companionMode=!!old.companionMode;
      }
    }
  }catch(_){}
  let book=books.find(b=>b.id===selectedId)||books[0];
  function recordFor(id){
    const b=books.find(b=>b.id===id);
    let r=state.records[id];
    if(!r||typeof r!=='object'||Array.isArray(r))r=state.records[id]={};
    r.page=Number.isInteger(r.page)?Math.max(0,Math.min(b.pages.length-1,r.page)):0;
    for(const key of ['saved','finished','opened'])r[key]=!!r[key];
    return r;
  }
  for(const key of ['page','saved','finished','opened'])Object.defineProperty(state,key,{get(){return recordFor(book.id)[key]},set(value){recordFor(book.id)[key]=value}});
  const $=id=>document.getElementById(id);
  const esc=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const asset=(b,path)=>`./books/library/${b.id}/${path}`;
  const pageImage=i=>asset(book,`${String(i+1).padStart(2,'0')}.jpg`);
  const localAudio=i=>asset(book,`audio/${String(i+1).padStart(2,'0')}.mp3`);
  const remoteAudio=i=>book.pages[i].sourceAudio;
  const themeLabel=id=>themes.find(t=>t.id===id)?.label||'';
  const stageLabel=id=>stages.find(t=>t.id===id)?.label||'';
  const audioLabel=b=>b.audioType==='human'?'原版真人朗读':b.audioType==='generated'?'AI英文配音':'设备英语朗读';
  let audio=null,utterance=null,playbackToken=0,playing=false,toastTimer=null,wordTimer=null;
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({selectedId:book.id,companionMode:state.companionMode,themeFilter:state.themeFilter,stageFilter:state.stageFilter,records:state.records}))}catch(_){}}
  function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
  function stop(){playbackToken++;playing=false;clearTimeout(wordTimer);if(audio){audio.onended=null;audio.onerror=null;audio.pause();audio=null;}utterance=null;if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(_){}}
  function fallbackSpeech(idx,continuous,token){
    if(token!==playbackToken)return;
    if(!('speechSynthesis'in window)){playing=false;render();toast('此设备暂时无法朗读，可以和孩子一起看图讲故事');return;}
    if(book.audioType!=='device')toast((book.audioType==='human'?'真人音频':'AI配音')+'暂时不可用，已切换设备备用朗读');
    try{
      const u=new SpeechSynthesisUtterance(book.pages[idx].en);utterance=u;u.lang='en-US';u.rate=.9;u.pitch=1;
      const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Natural|Samantha|Aria/i.test(v.name))||voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
      u.onend=()=>{if(token===playbackToken)onAudioEnd(idx,continuous,token)};
      u.onerror=()=>{if(token!==playbackToken)return;playing=false;render();toast('设备朗读不可用，可以试着自己读这一句')};
      playing=true;speechSynthesis.speak(u);render();
    }catch(_){playing=false;render();toast('播放失败，请稍后重试')}
  }
  function onAudioEnd(idx,continuous,token){
    if(token!==playbackToken)return;
    if(state.sheet==='word'){playing=false;render();return;}
    if(state.view!=='reader'||state.page!==idx)return;
    playing=false;
    if(continuous&&state.readMode==='listen'&&idx<book.pages.length-1){state.page++;recordFor(book.id).lastReadAt=Date.now();save();render();playPage(state.page,true)}
    else{render();if(continuous&&idx===book.pages.length-1)toast('故事听完了，可以点“读完啦”')}
  }
  function playPage(idx,continuous=false){
    stop();const token=playbackToken;
    if((state.view!=='reader'&&state.sheet!=='word')||idx<0||idx>=book.pages.length)return;
    if(!book.pages[idx].en){
      if(continuous){playing=true;render();wordTimer=setTimeout(()=>onAudioEnd(idx,true,token),2200)}
      else toast('这一页没有文字，一起看看画面吧');
      return;
    }
    if(book.audioType==='device'){fallbackSpeech(idx,continuous,token);return;}
    let triedRemote=false,done=false;const player=new Audio();audio=player;player.preload='auto';
    function begin(url){
      if(token!==playbackToken)return;player.src=url;
      const promise=player.play();
      if(promise&&typeof promise.catch==='function')promise.catch(err=>{
        if(token!==playbackToken||done)return;
        if(err?.name==='NotAllowedError'){playing=false;render();toast(state.sheet==='word'?'点击“听原句”继续播放':'点击“听英文”继续播放');return;}
        retryRemote();
      });
    }
    function retryRemote(){
      if(token!==playbackToken||done)return;
      if(!triedRemote){triedRemote=true;begin(remoteAudio(idx))}
      else{done=true;player.pause();fallbackSpeech(idx,continuous,token)}
    }
    player.onended=()=>onAudioEnd(idx,continuous,token);player.onerror=retryRemote;playing=true;render();begin(localAudio(idx));
  }
  function next(continuous=false){stop();if(state.page<book.pages.length-1){state.page++;recordFor(book.id).lastReadAt=Date.now();save();render();if(continuous)playPage(state.page,true)}else{state.view='done';state.finished=true;save();render()}}
  function previous(){stop();if(state.page>0){state.page--;save();render()}}
  function go(view){stop();state.view=view;state.sheet=null;if(view==='reader'){state.opened=true;recordFor(book.id).lastReadAt=Date.now()}save();render();window.scrollTo?.(0,0)}
  function openBook(id,view='detail'){const b=books.find(b=>b.id===id);if(!b)return;stop();book=b;state.wordId=null;go(view)}
  function header(back=false){return `<header class="simpleHead"><span class="brand">叽咕一下 <small>JIGU</small></span><button class="textBtn" data-go="${back?'shelf':'shelf'}">${back?'返回小书架':'小书架 ↗'}</button></header>`}
  function bottomNav(){return `<nav class="bottomNav" aria-label="主导航">${[['home','今天'],['shelf','小书架'],['mine','我的']].map(([v,label])=>`<button class="${state.view===v?'active':''}" data-go="${v}" ${state.view===v?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}
  function topicTags(b=book){return `<div class="topicTags"><span class="topicTag">${esc(themeLabel(b.primaryTheme))}</span><span class="topicTag">${esc(audioLabel(b))}</span></div>`}
  function cover(b=book){return `<img src="${asset(b,'cover.jpg')}" alt="《${esc(b.title)}》封面" loading="eager">`}
  function sourceMark(b=book){return b.source.name==='Book Dash'?`<img class="bookDashLogo" src="./books/library/book-dash-logo.png" alt="Book Dash">`:''}
  function wordCards(){return `<div class="wordGrid">${book.keywords.map(w=>`<button class="wordCard" data-action="word" data-word-id="${w.id}" aria-label="${esc(w.word)}，${esc(w.meaning)}，查看原书画面和听原句"><b lang="en">${esc(w.word)}</b><span>${esc(w.meaning)}</span></button>`).join('')}</div>`}
  function bookTile(){return `<section class="bookEntry"><div class="entryImage">${cover()}</div><div class="entryBody"><div class="metadata">${esc(book.stageId)} · ${esc(stageLabel(book.stageId))} · ${book.pages.length}页</div>${topicTags()}<h1>${esc(book.title)}</h1><p>${esc(book.zh)}</p><button class="primary" ${state.finished?'data-action="again"':'data-go="reader"'}>${state.finished?'再读一遍':state.opened?'继续阅读':'开始共读'} →</button><button class="wordEntry" data-action="words">这本书的${book.keywords.length}个小词 · ${book.keywords.map(w=>esc(w.word)).join(' / ')} ›</button>${sourceMark()}</div></section>`}
  function home(){return `<main class="page homePage">${header()}<div class="homeTitle">${state.opened?'接着读':'今天读这本'}</div>${bookTile()}<button class="mutedLink" data-action="prep">第一次读？家长先看一眼 ›</button><button class="libraryCount" data-go="shelf">去小书架挑一挑 <span>${books.length}本绘本 · 4个主题 →</span></button><div class="spacer"></div>${bottomNav()}</main>`}
  function shelfCard(b){const r=recordFor(b.id);return `<button class="shelfCard" data-book="${b.id}" aria-label="打开《${esc(b.title)}》"><div class="shelfCover">${cover(b)}${r.finished?'<span class="readBadge">读过啦</span>':r.opened?`<span class="readBadge">读到${r.page+1}页</span>`:''}</div><span class="cardStage">${b.stageId} · ${esc(themeLabel(b.primaryTheme))}</span><strong>${esc(b.zh)}</strong><span class="englishTitle" lang="en">${esc(b.title)}</span><small>${b.pages.length}页 · ${audioLabel(b)}</small></button>`}
  function shelf(){const filtered=books.filter(b=>(state.themeFilter==='all'||b.themeIds.includes(state.themeFilter))&&(state.stageFilter==='all'||b.stageId===state.stageFilter));return `<main class="page">${header()}<div class="shelfTitle"><h1>小书架</h1><span>${books.length}本精选绘本</span></div><p class="wordIntro">选一个感兴趣的主题，按自己的节奏读。</p><div class="filterGroup" role="group" aria-label="兴趣主题">${[{id:'all',label:'全部'},...themes].map(t=>`<button class="filterChip ${state.themeFilter===t.id?'selected':''}" data-filter-theme="${t.id}" aria-pressed="${state.themeFilter===t.id}">${t.label}</button>`).join('')}</div><div class="filterGroup stageFilters" role="group" aria-label="共读阶段">${[{id:'all',label:'全部阶段'},...stages.map(s=>({id:s.id,label:s.id+' '+s.label}))].map(t=>`<button class="filterChip ${state.stageFilter===t.id?'selected':''}" data-filter-stage="${t.id}" aria-pressed="${state.stageFilter===t.id}">${t.label}</button>`).join('')}</div><p class="filterCount">${filtered.length}本可选 · 不用按顺序，也没有解锁门槛</p>${filtered.length?`<div class="shelfGrid">${filtered.map(shelfCard).join('')}</div>`:`<div class="emptyBooks"><p>这个主题在这一阶段，还没有合适的书。</p><button class="secondary" data-action="reset-filters">看看全部绘本</button></div>`}<div class="spacer"></div>${bottomNav()}</main>`}
  function detail(){return `<main class="page">${header(true)}<div class="homeTitle">这本故事</div>${bookTile()}<div class="bookHelp"><b>${esc(book.stageId)} · ${esc(stageLabel(book.stageId))}</b><p>${book.stageId==='S1'?'先看图，听一听，指一指。':book.stageId==='S2'?'听听反复出现的说法，结合画面猜一猜。':'跟着画面读一个有起伏的小故事，中文陪读随时可以开。'}</p><p>${book.audioType==='human'?'本书有原版英文真人朗读。':book.audioType==='generated'?'本书使用统一制作的AI英文配音，可以逐页听，也可以连续听故事。':'本书使用设备英语朗读，声音随设备而不同。'}</p></div><button class="mutedLink" data-action="prep">家长先看一眼 ›</button><button class="mutedLink" data-action="credits">原书来源与授权 ›</button></main>`}
  function favoriteItem(b){return `<button class="favoriteBook" data-resume="${b.id}" aria-label="打开已收藏的《${esc(b.title)}》">${cover(b)}<span class="favoriteInfo"><b>${esc(b.title)}</b><small>${esc(b.zh)} · 继续阅读 →</small></span></button>`}
  function mine(){const recent=books.filter(b=>recordFor(b.id).opened).sort((a,b)=>(recordFor(b.id).lastReadAt||0)-(recordFor(a.id).lastReadAt||0)).slice(0,3);const favorites=books.filter(b=>recordFor(b.id).saved);return `<main class="page">${header()}<div class="homeTitle">我的</div><div class="readHistory"><strong>最近阅读</strong>${recent.length?recent.map(b=>{const r=recordFor(b.id);return `<button class="historyItem" data-resume="${b.id}"><b>${esc(b.zh)}</b><small>${r.finished?'已读完':`读到第${r.page+1}页`} · 继续阅读 →</small></button>`}).join(''):'<p>还没开始，去小书架挑一本喜欢的故事吧。</p>'}</div><div class="readHistory"><strong>我的收藏 · ${favorites.length}</strong>${favorites.length?favorites.map(favoriteItem).join(''):'<p>暂时还没有收藏的绘本</p>'}</div><p class="wordIntro">共读进度与收藏保存在当前设备。</p><div class="spacer"></div>${bottomNav()}</main>`}
  function reader(){const p=book.pages[state.page],pc=(state.page+1)/book.pages.length*100;return `<main class="page reading ${state.companionMode?'companionOn':''}"><header class="readerHeader"><button class="iconBtn" data-go="shelf" aria-label="返回小书架">‹</button><div class="heading">${esc(book.title)} <small>${state.page+1}/${book.pages.length}</small></div><button class="iconBtn ${state.saved?'heartActive':''}" data-action="favorite" aria-label="${state.saved?'取消收藏':'收藏这本书'}">${state.saved?'♥':'♡'}</button></header><div class="stepProgress"><div style="width:${pc}%"></div></div><div class="readMode"><div class="segment"><button data-action="together" class="${state.readMode==='together'?'active':''}">一起读</button><button data-action="listen" class="${state.readMode==='listen'?'active':''}">听故事</button></div><button class="companionSwitch ${state.companionMode?'active':''}" data-action="companion" role="switch" aria-checked="${state.companionMode}">陪读模式 · ${state.companionMode?'开':'关'}</button></div><div id="artFrame" class="artFrame"><div class="imgLoading">插画加载中…</div><img src="${pageImage(state.page)}" alt="${esc(p.alt||p.zh||'第'+(state.page+1)+'页原书插画')}" draggable="false" onload="this.parentElement.classList.add('loaded')" onerror="this.previousElementSibling.textContent='图片暂时无法加载，请稍后重试'" /></div><div class="textPanel">${p.en?`<h1 class="readEnglish" lang="en">${esc(p.en)}</h1>`:'<p class="wordlessHint">这一页，一起看图讲故事</p>'}</div>${state.companionMode?`<section class="companionPanel" aria-label="当前页中文与陪读提示">${p.zh?`<p class="companionTranslation">${esc(p.zh)}</p><div class="companionDivider"></div>`:''}<p class="companionTip"><span>陪读提示</span>${esc(p.tip)}</p></section>`:''}<div class="readerTools"><button class="tool listen" data-action="speak">${playing?'■ 停止朗读':p.en?'▶ '+(state.readMode==='listen'?'连续听':'听英文'):'一起看图'}</button><button class="textBtn" data-action="credits">${audioLabel(book)}</button></div><div class="pageControls"><button class="prev" data-action="prev" ${state.page===0?'disabled':''}>← 上一页</button><button class="next" data-action="next">${state.page===book.pages.length-1?'读完啦 ✓':'下一页 →'}</button></div></main>`}
  function finished(){return `<main class="page"><div class="simpleHead"><button class="iconBtn" data-go="shelf" aria-label="返回小书架">‹</button><span class="tiny">共读记录已保存</span></div><div class="endGraphic">☘</div><h1 class="endTitle">今天读完啦</h1><p class="endSub">《${esc(book.title)}》<br>喜欢的话，明天也可以再读一遍。</p><section class="wordSection"><h2>这本书的${book.keywords.length}个小词</h2><p class="wordIntro">点开看看故事里的画面，再听听原句。</p>${wordCards()}</section><section class="endActivity"><h3>读完去发现 · ${esc(book.activity.title)}</h3><p>${esc(book.activity.text)}</p><p class="activityHint">${esc(book.activity.hint)}</p></section><div class="spacer"></div><button class="primary" data-action="again">再读一遍</button><button class="mutedLink" data-go="shelf">去小书架挑下一本 →</button></main>`}
  function sheet(){
    if(!state.sheet)return '';let title='',body='';
    if(state.sheet==='words'){title=`这本书的${book.keywords.length}个小词`;body=`<p class="wordIntro">都来自刚刚的故事。点开看原图，听原句。</p>${wordCards()}`}
    if(state.sheet==='word'){
      const w=book.keywords.find(w=>w.id===state.wordId);if(!w)return '';title=`${w.word} · ${w.meaning}`;
      const p=book.pages[w.pageIndex],at=p.en.toLowerCase().indexOf(w.word.toLowerCase());
      const marked=at<0?esc(p.en):esc(p.en.slice(0,at))+'<mark>'+esc(p.en.slice(at,at+w.word.length))+'</mark>'+esc(p.en.slice(at+w.word.length));
      body=`<img class="wordArt" src="${pageImage(w.pageIndex)}" alt="${esc(p.zh||w.meaning)}"><p class="wordIntro">原书第${w.pageIndex+1}页 · ${audioLabel(book)}</p><p class="wordSentence" lang="en">${marked}</p><p class="wordMeaning">${esc(p.zh)}</p><div class="wordControls"><button class="secondary" data-action="word-audio">${playing?'■ 停止朗读':'▶ 听原句'}</button><button class="secondary" data-action="words">看看其他小词</button></div>`;
    }
    if(state.sheet==='prep'){
      title='家长先看一眼';const idx=book.pages.findIndex(p=>p.en);
      body=`<p class="sheetText" lang="en">${esc(book.pages[idx].en)}</p><p class="sheetSub">${esc(book.pages[idx].zh)}</p><p class="sheetSub">先看画面，再听一听。开启陪读模式，可以一直看到中文和陪读提示。孩子不必跟读或回答问题。</p><button class="secondary" data-action="prep-audio" data-page="${idx}">▶ ${book.audioType==='human'?'听真人示范音':book.audioType==='generated'?'听AI示范音':'听设备朗读'}</button>`;
    }
    if(state.sheet==='credits'){
      title='原书与朗读来源';const s=book.source,license=s.license.includes('/4.0/')?'CC BY 4.0':'CC BY 3.0';
      body=`<div class="credit">${sourceMark()}<b>${esc(book.title)}</b><br>创作：${s.creators.map(esc).join('；')}<br>出版与来源：<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a><br>图文许可：<a href="${esc(s.license)}" target="_blank" rel="noopener noreferrer">${license}</a><br>${book.audioType==='human'?`英文朗读：${esc(s.reader)}（Storybooks Canada / Global Storybooks）。沿用来源页所示许可；音频不可用时会提示切换设备备用朗读。`:book.audioType==='generated'?`英文朗读：叽咕制作的AI合成配音（${esc(book.narration.voice)}音色）。这是一项音频改编，不是原版真人录音；音频不可用时会提示切换设备备用朗读。`:'英文朗读：当前设备提供的英语合成语音，不是原版真人配音。'}<br><br>${s.name==='Book Dash'?'<a href="https://bookdash.org" target="_blank" rel="noopener noreferrer">Originally published by Book Dash</a>。原版创作贡献与署名见所链原书。<br>':''}叽咕新增中文辅助、陪读建议、重点词和亲子活动，并适配竖屏。原画与英文正文保留，中文为编辑初稿。叽咕不是出版方官方产品，也不代表原作者或出版方背书。</div>`;
    }
    return `<div class="sheetScrim" data-action="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheetHead"><span>${esc(title)}</span><button class="iconBtn" data-action="close" aria-label="关闭">×</button></div>${body}</div></div>`;
  }
  function render(){const view=state.view==='reader'?reader():state.view==='done'?finished():state.view==='shelf'?shelf():state.view==='mine'?mine():state.view==='detail'?detail():home();$('app').innerHTML=view+sheet();save()}
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action],[data-go],[data-book],[data-resume],[data-filter-theme],[data-filter-stage]');if(!el)return;
    if(el.dataset.book){openBook(el.dataset.book);return}
    if(el.dataset.resume){openBook(el.dataset.resume,'reader');return}
    if(el.dataset.filterTheme){state.themeFilter=el.dataset.filterTheme;render();return}
    if(el.dataset.filterStage){state.stageFilter=el.dataset.filterStage;render();return}
    const action=el.dataset.action;
    if(action==='close'&&e.target.closest('.sheet')&&!e.target.closest('button[data-action="close"]'))return;
    if(el.dataset.go){go(el.dataset.go);return}
    switch(action){
      case'reset-filters':state.themeFilter='all';state.stageFilter='all';render();break;
      case'words':stop();state.sheet='words';state.wordId=null;render();break;
      case'word':stop();state.wordId=el.dataset.wordId;if(book.keywords.some(w=>w.id===state.wordId)){state.sheet='word';render()}break;
      case'word-audio':{const w=book.keywords.find(w=>w.id===state.wordId);if(w)playing?(stop(),render()):playPage(w.pageIndex,false);break;}
      case'favorite':state.saved=!state.saved;render();toast(state.saved?'已收藏':'已取消收藏');break;
      case'prev':previous();break;
      case'next':next(state.readMode==='listen'&&playing);break;
      case'together':stop();state.readMode='together';render();break;
      case'listen':state.readMode='listen';playPage(state.page,true);break;
      case'speak':playing?(stop(),render()):playPage(state.page,state.readMode==='listen');break;
      case'again':stop();state.page=0;state.finished=false;go('reader');break;
      case'prep-audio':state.sheet=null;state.page=Number(el.dataset.page);go('reader');playPage(state.page,false);break;
      case'companion':state.companionMode=!state.companionMode;render();break;
      case'prep':case'credits':stop();state.sheet=action;render();break;
      case'close':stop();state.sheet=null;render();break;
    }
  });
  let gesture=null;
  document.addEventListener('touchstart',e=>{gesture=!state.sheet&&e.target.closest('#artFrame')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  document.addEventListener('touchend',e=>{if(!gesture||state.view!=='reader'||state.sheet)return;const dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;gesture=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)dx<0?next(false):previous()},{passive:true});
  window.addEventListener('keydown',e=>{if(state.sheet){if(e.key==='Escape'){stop();state.sheet=null;render()}return}if(e.target.closest('button,input,a'))return;if(state.view==='reader'){if(e.key==='ArrowLeft')previous();if(e.key==='ArrowRight')next(false)}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){stop();render()}});
  window.addEventListener('pagehide',stop);
  render();
})();

</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register(new URL("sw.js",document.baseURI)).catch(()=>{}))}</script></body></html>
