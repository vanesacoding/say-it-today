<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f1"><meta name="description" content="叽咕一下：精选分级英文绘本，孩子听故事，家长轻松陪读。"><title>叽咕一下 · 分级英文绘本</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;color:#352c28;background:#efebe5;--paper:#faf7f1;--brown:#342a25;--dim:#8c7e73;--peach:#c97853;--border:#eee8e0;--soft:#f3eee6}
*{box-sizing:border-box}body{margin:0}button{font:inherit;border:0;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #dfa77b;outline-offset:3px}a{color:inherit}.shell{max-width:460px;min-height:100dvh;margin:0 auto;background:var(--paper);box-shadow:0 10px 45px #58453115;position:relative}.page{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 19px) 20px calc(env(safe-area-inset-bottom) + 18px)}.simpleHead{display:flex;align-items:center;justify-content:space-between;gap:12px;height:43px;flex:none}.brand{font-size:19px;letter-spacing:-.05em;font-weight:850}.brand small{font-size:10px;font-weight:600;letter-spacing:.17em;color:#ae9d8d;margin-left:6px}.tiny{font-size:12px;color:var(--dim)}.textBtn{font-size:12px;color:#786a60;background:transparent;padding:9px 0}.iconBtn{width:38px;height:38px;display:grid;place-items:center;font-size:22px;background:transparent;border-radius:50%}.iconBtn:hover,.textBtn:hover{background:#efe7dd}.homeTitle{font-size:14px;font-weight:650;color:#8c7d6f;margin:31px 0 13px}.bookEntry{background:#fffcf8;border:1px solid #f0e9e0;border-radius:17px;overflow:hidden}.entryImage{display:flex;justify-content:center;align-items:center;background:#e7efe1;padding:14px}.entryImage img{height:auto;width:min(72%,250px);aspect-ratio:1;object-fit:contain;border-radius:5px;box-shadow:0 7px 24px #4a35251b}.entryBody{padding:19px 18px 20px}.entryBody h1{font-size:26px;letter-spacing:-.045em;margin:0 0 4px}.entryBody p{margin:0 0 18px;color:#897c70;font-size:13px}.metadata{font-size:11px;color:#777568;margin-bottom:13px}.primary{width:100%;border-radius:12px;padding:13px;background:#38312c;color:white;font-weight:700;font-size:14px}.secondary{background:#f0ebe4;border-radius:11px;padding:12px 14px;font-size:13px}.mutedLink{display:block;margin:19px auto 0;background:transparent;color:#918277;font-size:12px;padding:9px}.spacer{flex:1}.foot{margin-top:25px;font-size:11px;color:#a3978c;text-align:center;line-height:1.6}.reading{padding:calc(env(safe-area-inset-top) + 7px) 13px calc(env(safe-area-inset-bottom) + 12px)}.readerHeader{height:47px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.readerHeader .heading{font-size:13px;font-weight:700;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.readerHeader .heading small{font-size:10px;color:#a09386;margin-left:7px;font-weight:600}.heartActive{color:#c97462}.stepProgress{height:3px;border-radius:4px;background:#ece5db;overflow:hidden;margin:0 5px 15px}.stepProgress div{height:100%;background:#cf865f;transition:width .2s}.readMode{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:13px}.segment{padding:3px;background:#efe9e1;border-radius:12px;display:flex;gap:3px}.segment button{padding:8px 16px;font-size:12px;border-radius:9px;background:transparent;color:#817369}.segment button.active{background:#fffdf9;color:#302922;box-shadow:0 1px 4px #70513c10;font-weight:750}.pageCount{font-size:11px;color:#a19286}.artFrame{width:100%;aspect-ratio:1/1;background:#efeae2;border-radius:13px;overflow:hidden;touch-action:pan-y;user-select:none;position:relative;flex:none}.artFrame img{height:100%;width:100%;object-fit:contain;display:block}.imgLoading{position:absolute;inset:0;display:grid;place-items:center;color:#b3a89d;font-size:12px;background:#eee9e2}.artFrame.loaded .imgLoading{display:none}.textPanel{min-height:77px;display:flex;align-items:center;justify-content:center;padding:13px 5px 3px}.readEnglish{font-family:Georgia,"Times New Roman",serif;text-align:center;font-size:clamp(20px,5.8vw,27px);font-weight:700;line-height:1.27;letter-spacing:-.025em;color:#383029;margin:0}.readerTools{display:flex;gap:9px;justify-content:center;margin:11px 0 10px;flex:none}.tool{font-size:12px;border-radius:999px;border:1px solid #e8e1d8;background:#fdfaf6;padding:10px 15px;white-space:nowrap}.tool.listen{color:#955f40;border-color:#ead7c8}.tool:disabled{opacity:.4}.pageControls{display:flex;gap:11px;align-items:center;margin-top:auto;padding-top:9px;flex:none}.pageControls button{flex:1;font-size:13px;font-weight:650;height:46px;border-radius:12px}.prev{background:#eee9e1}.next{background:#352f2a;color:#fff}.prev:disabled{opacity:.36}.gestureHint{text-align:center;font-size:10px;color:#b4a89d;margin:11px 0 0}.sheetScrim{position:fixed;inset:0;background:#38271b57;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(100%,460px);background:#fffcf8;border-radius:20px 20px 0 0;padding:21px 24px calc(env(safe-area-inset-bottom) + 28px);box-shadow:0 -8px 20px #50362719;max-height:78dvh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:14px}.sheetText{font-size:16px;line-height:1.8;margin:8px 0;color:#3a322d}.sheetSub{font-size:12px;line-height:1.9;color:#82746a}.credit{font-size:12px;line-height:1.95;color:#796f64}.credit a{color:#996243;text-decoration:underline}.endGraphic{width:90px;height:90px;display:grid;place-items:center;background:#e8eede;border-radius:50%;font-size:37px;margin:70px auto 23px}.endTitle{text-align:center;font-size:25px;letter-spacing:-.05em;margin:0}.endSub{text-align:center;line-height:1.8;font-size:13px;color:#82746b;margin:10px 0 35px}.endActivity{border:1px solid #eae3d9;border-radius:14px;background:#fffdf9;padding:21px 20px;margin-bottom:25px}.endActivity h3{font-size:16px;margin:0 0 9px}.endActivity p{font-size:13px;line-height:1.9;color:#7d7064;margin:0}.status{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#40372d;color:white;font-size:12px;border-radius:99px;padding:10px 16px;z-index:90;max-width:88vw;text-align:center;box-shadow:0 4px 16px #2820152e}.hidden{display:none!important}
@media(max-width:345px){.page{padding-left:13px;padding-right:13px}.reading{padding-left:11px;padding-right:11px}.tool{padding:9px 12px}.textPanel{min-height:64px}.readerTools{gap:5px}.readMode{margin-bottom:8px}}@media(min-width:740px){.shell{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:23px;overflow:hidden}.page{min-height:calc(100dvh - 56px)}.reading{max-height:860px}}

.bottomNav{display:flex;justify-content:space-around;margin-top:16px;padding:14px 0 4px;border-top:1px solid var(--border)}.bottomNav button{padding:7px 15px;background:transparent;color:#97897f;font-size:12px;font-weight:600}.bottomNav button.active{color:#ad6b4d;font-weight:800}.readHistory{border:1px solid var(--border);background:#fffcf8;border-radius:14px;padding:19px;margin:10px 0}.readHistory strong{font-size:15px}.readHistory p{line-height:1.7;font-size:13px;color:var(--dim)}.readHistory .secondary{width:100%;margin:7px 0 0}.homePage .foot{display:none}
</style></head><body><div class="shell" id="app" aria-live="off"></div><div class="status hidden" id="toast" role="status"></div><script>
(() => {
  'use strict';
  const STORY_URL = 'https://storybookscanada.ca/stories/en/0087/';
  const AUDIO_URL = 'https://globalstorybooks.net/media/audio/en/0087/mp3/';
  const LICENSE = 'https://creativecommons.org/licenses/by/3.0/';
  const STORAGE_KEY = 'jigu-vertical-book-0087-v1';
  const book = {
    id:'0087', title:'I Like to Read!', zh:'我喜欢看书', stage:'S1 · 看图听故事', level:'African Storybook Level 1',
    pages:[
      {en:'I like to read.',zh:'我喜欢看书。',tip:'指着男孩手里的书，可以问一句：Where is the book? 孩子指一指就很好。'},
      {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'跟孩子一起猜猜，男孩会去找谁听故事？不要求回答英文。'},
      {en:'My sister is asleep.',zh:'我的妹妹睡着了。',tip:'指指画面里睡着的妹妹，轻声说 asleep（睡着了），做一个安静的动作。'},
      {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'再听一遍熟悉的问题，看看男孩往哪里走。'},
      {en:'My mother and grandmother are busy.',zh:'妈妈和奶奶正在忙。',tip:'找一找画面里的妈妈和奶奶。你们可以聊聊她们在做什么。'},
      {en:'Who can I read to?',zh:'我可以念给谁听呢？',tip:'先停一下，邀请孩子猜测男孩接下来要找谁。'},
      {en:'My father and grandfather are busy.',zh:'爸爸和爷爷正在忙。',tip:'看看他们在忙什么，试着一起找找画面里的车。'},
      {en:'Who can I read to? I can read to myself!',zh:'我可以念给谁听呢？我可以念给自己听！',tip:'男孩终于找到办法啦。和孩子拿出家里的小书，一起翻一页吧。'}
    ]
  };
  const state = {view:'home',page:0,readMode:'together',saved:false,finished:false,opened:false,sheet:null};
  try {
    const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(old && typeof old==='object') {
      state.page=Number.isInteger(old.page)?Math.max(0,Math.min(7,old.page)):0;
      state.saved=!!old.saved;state.finished=!!old.finished;state.opened=!!old.opened;
    }
  } catch (_) {}
  const $ = id => document.getElementById(id);
  const esc = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pageImage = i => `./books/read/${String(i+1).padStart(2,'0')}.jpg`;
  const localAudio = i => `./books/read/audio/${String(i+1).padStart(2,'0')}.mp3`;
  const remoteAudio = i => `${AUDIO_URL}${String(i+2).padStart(2,'0')}.mp3`;
  let audio=null, utterance=null, playbackToken=0, playing=false, toastTimer=null;
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({page:state.page,saved:state.saved,finished:state.finished,opened:state.opened}))}catch(_){}}
  function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
  function stop(){playbackToken++;playing=false;if(audio){audio.onended=null;audio.onerror=null;audio.pause();audio=null;}utterance=null;if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(_){} }
  function fallbackSpeech(idx,continuous,token){
    if(token!==playbackToken)return;
    if(!('speechSynthesis' in window)){playing=false;render();toast('音频暂时无法播放，请尝试稍后重试');return;}
    toast('真人音频暂时不可用，已切换设备备用朗读');
    try {
      const u=new SpeechSynthesisUtterance(book.pages[idx].en);utterance=u;
      u.lang='en-US';u.rate=.86;u.pitch=1;
      const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>v.lang?.toLowerCase().startsWith('en'))||null;
      u.onend=()=>{if(token!==playbackToken)return;onAudioEnd(idx,continuous,token)};
      u.onerror=()=>{if(token!==playbackToken)return;playing=false;render();toast('设备朗读也不可用，试着自己读这句话')};
      playing=true;speechSynthesis.speak(u);render();
    } catch (_) {playing=false;render();toast('播放失败，请尝试自己朗读')}
  }
  function onAudioEnd(idx,continuous,token){
    if(token!==playbackToken || state.view!=='reader' || state.page!==idx)return;
    playing=false;
    if(continuous && state.readMode==='listen' && idx<book.pages.length-1){
      state.page++;save();render();playPage(state.page,true);
    } else {
      render();
      if(continuous && idx===book.pages.length-1)toast('故事听完了，可以点“读完啦”');
    }
  }
  function playPage(idx,continuous=false){
    stop();const token=playbackToken;
    if(state.view!=='reader'||idx<0||idx>=book.pages.length)return;
    let triedRemote=false,done=false;
    const player=new Audio();audio=player;
    player.preload='auto';player.playbackRate=1;
    function failToFallback(){if(done||token!==playbackToken)return;done=true;try{player.pause()}catch(_){};fallbackSpeech(idx,continuous,token)}
    function begin(url){
      if(token!==playbackToken)return;
      player.src=url;
      const promise=player.play();
      if(promise&&typeof promise.catch==='function')promise.catch(err=>{
        if(token!==playbackToken || done)return;
        if(err?.name==='NotAllowedError') {playing=false;render();toast('点击“听英文”继续播放');return;}
        retryRemote();
      });
    }
    function retryRemote(){
      if(token!==playbackToken||done)return;
      if(!triedRemote){triedRemote=true;begin(remoteAudio(idx));}
      else failToFallback();
    }
    player.onended=()=>onAudioEnd(idx,continuous,token);
    player.onerror=retryRemote;
    playing=true;render();
    begin(localAudio(idx));
  }
  function next(continuous=false){stop();if(state.page<7){state.page++;save();render();if(continuous)playPage(state.page,true)}else{state.view='done';state.finished=true;save();render()}}
  function previous(){stop();if(state.page>0){state.page--;save();render()}}
  function go(view){stop();state.view=view;state.sheet=null;if(view==='reader')state.opened=true;save();render()}
  function header(right){return `<header class="simpleHead"><span class="brand">叽咕一下 <small>JIGU</small></span>${right?`<button class="textBtn" data-go="${right==='shelf'?'shelf':'home'}">${right==='shelf'?'小书架 ↗':'返回今天'}</button>`:''}</header>`}
  function cover(){return `<img src="${pageImage(0)}" alt="《I Like to Read!》插画：男孩坐在橙色椅子上读书" loading="eager">`}
  function bottomNav(){return `<nav class="bottomNav" aria-label="主导航"><button class="${state.view==='home'?'active':''}" data-go="home">今天</button><button class="${state.view==='shelf'?'active':''}" data-go="shelf">小书架</button><button class="${state.view==='mine'?'active':''}" data-go="mine">我的</button></nav>`}
  function bookTile(){return `<section class="bookEntry"><div class="entryImage">${cover()}</div><div class="entryBody"><div class="metadata">S1 · 看图听故事 · 8页</div><h1>${book.title}</h1><p>${book.zh}</p><button class="primary" data-go="reader">${state.opened?'继续阅读':'开始共读'} →</button></div></section>`}
  function home(){return `<main class="page homePage">${header('shelf')}<div class="homeTitle">${state.opened?'接着读':'今天读这本'}</div>${bookTile()}<button class="mutedLink" data-action="prep">第一次读？妈妈先看一眼 ›</button><div class="spacer"></div>${bottomNav()}</main>`}
  function shelf(){return `<main class="page">${header('home')}<div class="homeTitle">小书架</div><div class="metadata">S1 · 看图听故事</div>${bookTile()}<div class="spacer"></div>${bottomNav()}</main>`}
  function mine(){return `<main class="page">${header('home')}<div class="homeTitle">我的</div><div class="readHistory"><strong>最近阅读</strong><p>《I Like to Read!》 · ${state.finished?'已读完':state.opened?`读到第${state.page+1}页`:'还没开始'}</p><button class="secondary" data-go="reader">${state.opened?'继续阅读':'打开绘本'} →</button></div><div class="readHistory"><strong>我的收藏</strong><p>${state.saved?'♥ I Like to Read!':'暂时还没有收藏的绘本'}</p></div><button class="mutedLink" data-action="credits">原书来源与授权 ›</button><div class="spacer"></div>${bottomNav()}</main>`}
  function reader(){const p=book.pages[state.page],pc=(state.page+1)/8*100;return `<main class="page reading"><header class="readerHeader"><button class="iconBtn" data-go="home" aria-label="返回首页">‹</button><div class="heading">I Like to Read! <small>${state.page+1}/8</small></div><button class="iconBtn ${state.saved?'heartActive':''}" data-action="favorite" aria-label="${state.saved?'取消收藏':'收藏这本书'}">${state.saved?'♥':'♡'}</button></header><div class="stepProgress"><div style="width:${pc}%"></div></div><div class="readMode"><div class="segment"><button data-action="together" class="${state.readMode==='together'?'active':''}">一起读</button><button data-action="listen" class="${state.readMode==='listen'?'active':''}">听故事</button></div><div class="pageCount">${state.page+1} / 8</div></div><div id="artFrame" class="artFrame" aria-label="第${state.page+1}页原版插画，左右轻扫可以翻页"><div class="imgLoading">插画加载中…</div><img src="${pageImage(state.page)}" alt="第${state.page+1}页原书插画" draggable="false" onload="this.parentElement.classList.add('loaded')" onerror="this.previousElementSibling.textContent='图片暂时无法加载'" /></div><div class="textPanel"><h1 class="readEnglish">${esc(p.en)}</h1></div><div class="readerTools"><button class="tool listen" data-action="speak">${playing?'■ 停止朗读':state.readMode==='listen'?'▶ 连续听':'▶ 听英文'}</button><button class="tool" data-action="translation">中文</button><button class="tool" data-action="tip">陪读提示</button></div><div class="pageControls"><button class="prev" data-action="prev" ${state.page===0?'disabled':''}>← 上一页</button><button class="next" data-action="next">${state.page===7?'读完啦 ✓':'下一页 →'}</button></div></main>`}
  function finished(){return `<main class="page"><div class="simpleHead"><button class="iconBtn" data-go="home" aria-label="返回今天">‹</button><span class="tiny">共读记录已保存</span></div><div class="endGraphic">☘</div><h1 class="endTitle">今天读完啦</h1><p class="endSub">《I Like to Read!》<br>喜欢的话，明天也可以再读一遍。</p><div class="endActivity"><h3>放下手机，继续读</h3><p>和孩子找一本家里的小书，轮流翻一翻。可以试着说一句：I like to read. 不用打卡，也不用证明完成。</p></div><div class="spacer"></div><button class="primary" data-action="again">再读一遍</button><button class="mutedLink" data-go="home">返回今天</button></main>`}
  function sheet(){
    if(!state.sheet)return '';
    let title='',body='';const p=book.pages[state.page];
    if(state.sheet==='translation'){title='中文理解';body=`<p class="sheetText">${esc(p.zh)}</p>`}
    if(state.sheet==='tip'){title='给妈妈的小提示';body=`<p class="sheetText">${esc(p.tip)}</p><p class="sheetSub">孩子可以用眼神、动作、指认或中文回应，不必答对。</p>`}
    if(state.sheet==='prep'){title='妈妈先看一眼';body=`<p class="sheetText" style="font-family:Georgia,serif;font-weight:700">Who can I read to?</p><p class="sheetSub">我可以念给谁听呢？</p><p class="sheetSub">这是故事里反复出现的一句话。试着让孩子猜猜男孩下一步会找谁。</p><button class="secondary" data-action="prep-audio">▶ 听真人示范音</button>`}
    if(state.sheet==='credits'){title='原书与配音来源';body=`<div class="credit">原作：《I Like to Read!》<br>文字：Letta Machoga<br>插画：Wiehan de Jager<br>英文朗读：Darshan Soni（Storybooks Canada / Global Storybooks）<br>故事及相应朗读：<a href="${LICENSE}" target="_blank" rel="noopener noreferrer">CC BY 3.0</a><br>来源：<a href="${STORY_URL}" target="_blank" rel="noopener noreferrer">African Storybook / Storybooks Canada</a><br>音频来源：<a href="https://github.com/global-asp/gsn-audio" target="_blank" rel="noopener noreferrer">Global Storybooks 音频项目</a><br>中文辅助和妈妈陪读建议由叽咕编写，非原出版机构内容。音频在无法访问时可能降级为设备合成朗读。<br>叽咕不是出版方官方产品，亦不代表获得其商业背书。</div>`}
    return `<div class="sheetScrim" data-action="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheetHead"><span>${title}</span><button class="iconBtn" data-action="close" aria-label="关闭">×</button></div>${body}</div></div>`;
  }
  function render(){const page=state.view==='reader'?reader():state.view==='done'?finished():state.view==='shelf'?shelf():state.view==='mine'?mine():home();$('app').innerHTML=page+sheet();save()}
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action],[data-go]');if(!el)return;
    const action=el.dataset.action;
    if(action==='close'&&e.target.closest('.sheet')&&!e.target.closest('button[data-action="close"]'))return;
    if(el.dataset.go){go(el.dataset.go);return}
    switch(action){
      case 'favorite':state.saved=!state.saved;render();toast(state.saved?'已收藏':'已取消收藏');break;
      case 'prev':previous();break;
      case 'next':next(state.readMode==='listen'&&playing);break;
      case 'together':stop();state.readMode='together';render();break;
      case 'listen':state.readMode='listen';playPage(state.page,true);break;
      case 'speak':playing?(stop(),render()):playPage(state.page,state.readMode==='listen');break;
      case 'again':stop();state.page=0;go('reader');break;
      case 'prep-audio':state.sheet=null;state.view='reader';state.page=1;state.opened=true;save();render();playPage(1,false);break;
      case 'translation':case 'tip':case 'prep':case 'credits':stop();state.sheet=action;render();break;
      case 'close':state.sheet=null;render();break;
    }
  });
  let gesture=null;
  document.addEventListener('touchstart',e=>{const frame=e.target.closest('#artFrame');gesture=frame?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  document.addEventListener('touchend',e=>{if(!gesture||state.view!=='reader')return;const dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;gesture=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)dx<0?next(false):previous()},{passive:true});
  window.addEventListener('keydown',e=>{if(state.sheet){if(e.key==='Escape'){state.sheet=null;render()}return}if(state.view==='reader'){if(e.key==='ArrowLeft')previous();if(e.key==='ArrowRight')next(false)}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stop()});
  window.addEventListener('pagehide',stop);
  render();
})();

</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register(new URL("sw.js",document.baseURI)).catch(()=>{}))}</script></body></html>
