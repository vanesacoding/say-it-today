  function fitSingArtwork(){const wrap=document.querySelector('.singArtwork'),frame=wrap?.querySelector('.singArtViewport');if(!frame)return;const r=wrap.getBoundingClientRect(),ratio=Number(frame.dataset.artRatio);if(r.width>0&&r.height>0){const width=Math.min(r.width,r.height*ratio);frame.style.width=width+'px';frame.style.height=width/ratio+'px';}}
