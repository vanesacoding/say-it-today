</style></head><body><div class="shell" id="app" aria-live="off"></div><div class="status hidden" id="toast" role="status"></div><script src="./books/curation.js"></script><script src="./books/catalog.js"></script><script src="./books/vocabulary.js"></script><script>
(() => {
  'use strict';
  const books=window.JIGU_BOOKS.filter(b=>!window.JIGU_CURATION.withdrawnIds.includes(b.id));
  const activeBooks=books.filter(b=>!b.archived);
  const vocab=window.JiguVocabulary;
  const STORAGE_KEY='jigu-reading-library-v2';
  const LEGACY_KEY='jigu-vertical-book-0087-v1';
  const themes=[{id:'everyday',label:'日常生活'},{id:'nature',label:'动物与自然'},{id:'discovery',label:'颜色与发现'},{id:'feelings',label:'心情与朋友'}];
  const stages=[{id:'S1',label:'看图启蒙'},{id:'S2',label:'短句共读'},{id:'S3',label:'故事进阶'}];
  const state={view:'home',readMode:'together',companionMode:false,sheet:null,wordId:null,themeFilter:'all',stageFilter:'all',records:{},wordSaves:{},wordReviews:{},review:null,focusWordKey:null,readerReturn:null};
  let selectedId='0087';
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved&&typeof saved==='object'){
      state.records=saved.records&&typeof saved.records==='object'&&!Array.isArray(saved.records)?saved.records:{};
      state.wordSaves=saved.wordSaves&&typeof saved.wordSaves==='object'&&!Array.isArray(saved.wordSaves)?saved.wordSaves:{};
      state.wordReviews=saved.wordReviews&&typeof saved.wordReviews==='object'&&!Array.isArray(saved.wordReviews)?saved.wordReviews:{};
      state.companionMode=!!saved.companionMode;
      if(activeBooks.some(b=>b.id===saved.selectedId))selectedId=saved.selectedId;
    }else{
      const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');
      if(old&&typeof old==='object'){
        state.records['0087']={page:old.page,saved:!!old.saved,finished:!!old.finished,opened:!!old.opened};
        state.companionMode=!!old.companionMode;
      }
    }
  }catch(_){}
  let book=activeBooks.find(b=>b.id===selectedId)||activeBooks[0];
  function recordFor(id){
    const b=books.find(b=>b.id===id);
    let r=state.records[id];
    if(!r||typeof r!=='object'||Array.isArray(r))r=state.records[id]={};
    r.page=Number.isInteger(r.page)?Math.max(0,Math.min(b.pages.length-1,r.page)):0;
    r.furthestPage=Math.max(r.page,Number.isInteger(r.furthestPage)?Math.min(b.pages.length-1,Math.max(0,r.furthestPage)):0);
    for(const key of ['saved','finished','opened'])r[key]=!!r[key];
    return r;
  }
  for(const key of ['page','saved','finished','opened'])Object.defineProperty(state,key,{get(){return recordFor(book.id)[key]},set(value){const r=recordFor(book.id);r[key]=value;if(key==='page')r.furthestPage=Math.max(r.furthestPage,value)}});
  const $=id=>document.getElementById(id);
  const esc=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const asset=(b,path)=>`./books/library/${b.id}/${path}`;
  const pageImage=i=>asset(book,`${String(i+1).padStart(2,'0')}.jpg`);
  const localAudio=i=>asset(book,book.pages[i].audioFile||`audio/${String(i+1).padStart(2,'0')}.mp3`);
  const remoteAudio=i=>book.pages[i].sourceAudio;

  function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
  function stop(){playbackToken++;playing=false;clearTimeout(wordTimer);if(audio){audio.onended=null;audio.onerror=null;audio.pause();audio=null;}utterance=null;if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(_){}}
  function fallbackSpeech(idx,continuous,token){
    if(token!==playbackToken)return;

    if(book.audioType!=='device')toast('朗读暂时不可用，已切换设备备用朗读');

      u.onend=()=>{if(token===playbackToken)onAudioEnd(idx,continuous,token)};

  function onAudioEnd(idx,continuous,token){

  function playPage(idx,continuous=false){
    stop();const token=playbackToken;
    if((state.view!=='reader'&&state.sheet!=='word')||idx<0||idx>=book.pages.length)return;
    if(!book.pages[idx].en){
      if(continuous){playing=true;render();wordTimer=setTimeout(()=>onAudioEnd(idx,true,token),2200)}

    let triedRemote=false,done=false;const player=new Audio();audio=player;player.preload='auto';
    function begin(url){

  function next(continuous=false){stop();if(state.page<book.pages.length-1){state.page++;recordFor(book.id).lastReadAt=Date.now();save();render();if(continuous)playPage(state.page,true)}else{state.view='done';state.finished=true;save();render()}}

  function go(view){stop();if(!['reader','done'].includes(view))state.readerReturn=null;if(view==='home'&&book.archived)book=activeBooks.find(b=>state.records[b.id]?.opened)||activeBooks[0];state.view=view;state.sheet=null;if(view==='reader'){state.opened=true;recordFor(book.id).lastReadAt=Date.now()}save();render();window.scrollTo?.(0,0)}
  function openBook(id,view='detail'){const b=books.find(b=>b.id===id);if(!b)return;stop();state.readerReturn=null;book=b;state.wordId=null;go(view)}
  function header(back=false){return `<header class="simpleHead"><span class="brand">叽咕一下 <small>JIGU</small></span><button class="textBtn" data-go="${back?'shelf':'shelf'}">${back?'返回小书架':'小书架 ↗'}</button></header>`}
  function bottomNav(){return `<nav class="bottomNav" aria-label="主导航">${[['home','今天'],['shelf','小书架'],['mine','我的']].map(([v,label])=>`<button class="${(state.view===v||(v==='mine'&&['vocabulary','review'].includes(state.view)))?'active':''}" data-go="${v}" ${(state.view===v||(v==='mine'&&['vocabulary','review'].includes(state.view)))?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`}

  function wordCards(){return `<div class="wordGrid">${book.keywords.map(w=>`<button class="wordCard" data-action="word" data-word-id="${w.id}" aria-label="${esc(w.word)}，${esc(w.meaning)}，查看原书画面和听原句"><b lang="en">${esc(w.word)}</b><span>${esc(w.meaning)}</span></button>`).join('')}</div>`}
  function bookTile(){return `<section class="bookEntry"><div class="entryImage">${cover()}</div><div class="entryBody"><div class="metadata">${esc(stageLabel(book.stageId))} · ${book.pages.length}页</div>${topicTags()}<h1>${esc(book.title)}</h1><p>${esc(book.zh)}</p><button class="primary" ${state.finished?'data-action="again"':'data-go="reader"'}>${state.finished?'再读一遍':state.opened?'继续阅读':'开始共读'} →</button><button class="wordEntry" data-action="words">这本书的${book.keywords.length}个小词 · ${book.keywords.map(w=>esc(w.word)).join(' / ')} ›</button>${sourceMark()}</div></section>`}
  function vocabularyItems(){return vocab.collect(books,state.records,state.wordSaves)}

  function sourceFor(item){const source=item.sources[0];return {...source,book:books.find(b=>b.id===source.bookId)}}
  function highlightWords(text,words){
    const spans=[],lower=text.toLowerCase();
    for(const word of [...new Set(words)].sort((a,b)=>b.length-a.length)){
      const needle=word.toLowerCase();if(!needle)continue;
      let from=0,at;
      while((at=lower.indexOf(needle,from))!==-1){
        const end=at+word.length;from=end;
        if(/[\p{L}\p{N}_]/u.test(text[at-1]||'')||/[\p{L}\p{N}_]/u.test(text[end]||''))continue;
        if(!spans.some(s=>at<s.end&&end>s.at))spans.push({at,end});
      }
    }
    let result='',offset=0;
    for(const span of spans.sort((a,b)=>a.at-b.at)){result+=esc(text.slice(offset,span.at))+'<mark class="readingKeyword">'+esc(text.slice(span.at,span.end))+'</mark>';offset=span.end}

  function playVocabulary(item){

    const finish=()=>{if(token!==playbackToken)return;ended=true;playing=false;render()};

    function begin(url){if(token!==playbackToken)return;player.src=url;const promise=player.play();promise?.catch(error=>{if(token!==playbackToken||ended)return;if(error?.name==='NotAllowedError'){finish();toast('请再点一下听原句')}else fail()})}
    player.onended=finish;player.onerror=fail;playing=true;render();begin(asset(b,p.audioFile||`audio/${String(source.pageIndex+1).padStart(2,'0')}.mp3`));
  }
  function startReview(count=3,onlyBook=false){

  }

  function reader(){const p=book.pages[state.page],pc=(state.page+1)/book.pages.length*100;return `<main class="page reading ${p.mobilePanels?'mobileReading':''} ${state.companionMode?'companionOn':''}"><header class="readerHeader"><button class="iconBtn" ${state.readerReturn?'data-action="reader-back"':'data-go="shelf"'} aria-label="${state.readerReturn?'返回刚才的小词':'返回小书架'}">‹</button><div class="heading">${esc(book.title)} <small>${book.archived?'旧版 · ':''}${state.page+1}/${book.pages.length}</small></div><button class="iconBtn ${state.saved?'heartActive':''}" data-action="favorite" aria-label="${state.saved?'取消收藏':'收藏这本书'}">${state.saved?'♥':'♡'}</button></header><div class="stepProgress"><div style="width:${pc}%"></div></div><div class="readMode"><div class="segment"><button data-action="together" class="${state.readMode==='together'?'active':''}">一起读</button><button data-action="listen" class="${state.readMode==='listen'?'active':''}">听故事</button></div><button class="companionSwitch ${state.companionMode?'active':''}" data-action="companion" role="switch" aria-checked="${state.companionMode}">陪读模式 · ${state.companionMode?'开':'关'}</button></div>${readerArt(p)}<div class="textPanel">${p.en?`<h1 class="readEnglish" lang="en">${highlightWords(p.en,book.keywords.map(w=>w.word))}</h1>`:'<p class="wordlessHint">这一页，一起看图讲故事</p>'}</div>${state.companionMode?`<section class="companionPanel" aria-label="当前页中文与陪读提示">${p.zh?`<p class="companionTranslation">${esc(p.zh)}</p><div class="companionDivider"></div>`:''}<p class="companionTip"><span>陪读提示</span>${esc(p.tip)}</p></section>`:''}<div class="readerTools"><button class="tool listen" data-action="speak">${playing?'■ 停止朗读':p.en?'▶ '+(state.readMode==='listen'?'连续听':'听英文'):'一起看图'}</button><button class="textBtn" data-action="credits">绘本说明</button></div><div class="pageControls"><button class="prev" data-action="prev" ${state.page===0?'disabled':''}>← 上一页</button><button class="next" data-action="next">${state.page===book.pages.length-1?'读完啦 ✓':'下一页 →'}</button></div></main>`}
  function finished(){return `<main class="page"><div class="simpleHead"><button class="iconBtn" ${state.readerReturn?'data-action="reader-back"':'data-go="shelf"'} aria-label="${state.readerReturn?'返回刚才的小词':'返回小书架'}">‹</button><span class="tiny">共读记录已保存</span></div><div class="endGraphic">☘</div><h1 class="endTitle">今天读完啦</h1><p class="endSub">《${esc(book.title)}》<br>喜欢的话，明天也可以再读一遍。</p><section class="wordSection"><h2>这本书的${book.keywords.length}个小词</h2><p class="wordIntro">点开看看故事里的画面，再听听原句。</p>${wordCards()}<div class="wordControls"><button class="secondary" data-action="review-book">轻松复习这几个词</button><button class="secondary" data-go="vocabulary">我的小词本 ›</button></div></section><section class="endActivity"><h3>读完去发现 · ${esc(book.activity.title)}</h3><p>${esc(book.activity.text)}</p><p class="activityHint">${esc(book.activity.hint)}</p></section><div class="spacer"></div><button class="primary" data-action="again">再读一遍</button><button class="mutedLink" data-go="shelf">去小书架挑下一本 →</button></main>`}
  function sheet(){
    if(!state.sheet)return '';let title='',body='';
    if(state.sheet==='stages'){title='共读阶段怎么选';body=`<p class="stageGuideIntro">按英语接触程度选，不用按年龄卡门槛。</p><dl class="stageGuideList"><div class="stageGuideRow"><dt>看图启蒙</dt><dd>先听一听、指一指，不要求跟读。</dd></div><div class="stageGuideRow"><dt>短句共读</dt><dd>听重复短句，结合画面理解意思。</dd></div><div class="stageGuideRow"><dt>故事进阶</dt><dd>跟着情节读故事，需要时打开中文陪读。</dd></div></dl><p class="stageGuideFoot">不确定就选“全部阶段”，先读孩子感兴趣的书。没有解锁门槛，随时可以换阶段。</p>`}
    if(state.sheet==='words'){title=`这本书的${book.keywords.length}个小词`;body=`<p class="wordIntro">都来自刚刚的故事。点开看原图，听原句。</p>${wordCards()}`}
    if(state.sheet==='word'){
      const w=book.keywords.find(w=>w.id===state.wordId);if(!w)return '';title=`${w.word} · ${w.meaning}`;
      const p=book.pages[w.pageIndex],at=p.en.toLowerCase().indexOf(w.word.toLowerCase());
      const marked=at<0?esc(p.en):esc(p.en.slice(0,at))+'<mark>'+esc(p.en.slice(at,at+w.word.length))+'</mark>'+esc(p.en.slice(at+w.word.length));
      body=`<img class="wordArt" src="${pageImage(w.pageIndex)}" alt="${esc(p.zh||w.meaning)}"><p class="wordIntro">原书第${w.pageIndex+1}页</p><p class="wordSentence" lang="en">${marked}</p><p class="wordMeaning">${esc(p.zh)}</p><div class="wordControls"><button class="secondary" data-action="word-audio">${playing?'■ 停止朗读':'▶ 听原句'}</button><button class="secondary" data-action="words">看看其他小词</button></div><button class="wordSave" data-action="word-save" ${vocabularyItem(vocab.keyFor(w.word))?'disabled':''}>${vocabularyItem(vocab.keyFor(w.word))?'已收录小词本':'+ 加入我的小词本'}</button>`;
    }
    if(state.sheet==='vocabulary-word'){
      const item=vocabularyItem(state.focusWordKey);if(!item)return '';const source=sourceFor(item),p=source.book.pages[source.pageIndex];title=`${item.word} · ${item.meaning}`;
      body=`<img class="wordArt" src="${asset(source.book,String(source.pageIndex+1).padStart(2,'0')+'.jpg')}" alt="《${esc(source.book.zh)}》第${source.pageIndex+1}页插画"><p class="wordIntro">《${esc(source.book.zh)}》第${source.pageIndex+1}页</p><p class="wordSentence" lang="en">${markSentence(p.en,item.word)}</p><p class="wordMeaning">${esc(p.zh)}</p><div class="wordControls"><button class="secondary" data-action="vocabulary-audio">${playing?'■ 停止朗读':'▶ 听原句'}</button><button class="secondary" data-action="vocabulary-source" data-key="${esc(item.key)}">回到原书这一页</button></div>`;
    }
    if(state.sheet==='prep'){
      title='家长先看一眼';const idx=book.pages.findIndex(p=>p.en);
      body=`<p class="sheetText" lang="en">${esc(book.pages[idx].en)}</p><p class="sheetSub">${esc(book.pages[idx].zh)}</p><p class="sheetSub">先看画面，再听一听。开启陪读模式，可以一直看到中文和陪读提示。孩子不必跟读或回答问题。</p><button class="secondary" data-action="prep-audio" data-page="${idx}">▶ 听英文示范</button>`;
    }
    if(state.sheet==='original-art'){
      const p=book.pages[state.page],spread=book.source.spreads.find(s=>s.index===p.sourceSpreadIndex);title='原书完整跨页';
      body=`<img class="originalArt" src="${pageImage(state.page)}" alt="${esc(p.alt)} · 原书完整跨页"><p class="sheetText" lang="en">${esc(spread.text)}</p><p class="sheetSub">手机阅读按画面分镜展示，原始插画与英文完整保留。</p>`;
    }
    if(state.sheet==='credits'){
      title='原书与朗读来源';const s=book.source,license=s.licenseLabel||(s.license.includes('/by-nc/')?'CC BY-NC · 仅限非商业使用':s.license.includes('/4.0/')?'CC BY 4.0':'CC BY 3.0');
      body=`<div class="credit">${sourceMark()}<b>${esc(book.title)}</b><br>创作：${s.creators.map(esc).join('；')}<br>出版与来源：<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a><br>图文许可：<a href="${esc(s.license)}" target="_blank" rel="noopener noreferrer">${license}</a><br>${book.audioType==='human'?`英文朗读：${esc(s.reader)}（Storybooks Canada / Global Storybooks）。沿用来源页所示许可；音频不可用时会提示切换设备备用朗读。`:book.audioType==='generated'?`英文朗读：叽咕制作的AI合成配音（${esc(book.narration.voice)}音色）。这是一项音频改编，不是原版真人录音；音频不可用时会提示切换设备备用朗读。`:'英文朗读：当前设备提供的英语合成语音，不是原版真人配音。'}<br><br>${s.name==='Book Dash'?'<a href="https://bookdash.org" target="_blank" rel="noopener noreferrer">Originally published by Book Dash</a>。原版创作贡献与署名见所链原书。<br>':''}叽咕新增中文辅助、陪读建议、重点词和亲子活动，并适配竖屏。原画保留；${s.editorialNote?esc(s.editorialNote):'英文正文保留，中文为编辑初稿。'}叽咕不是出版方官方产品，也不代表原作者或出版方背书。</div>`;
    }
    return `<div class="sheetScrim" data-action="close"><div class="sheet ${state.sheet==='stages'?'sheetStages':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheetHead"><span>${esc(title)}</span><button class="iconBtn" data-action="close" aria-label="关闭">×</button></div>${body}</div></div>`;
  }
  let themeScrollLeft=0;
  function render(){const oldRail=$('app').querySelector('.themeFilters');if(oldRail)themeScrollLeft=oldRail.scrollLeft;const view=state.view==='reader'?reader():state.view==='done'?finished():state.view==='shelf'?shelf():state.view==='mine'?mine():state.view==='vocabulary'?vocabularyView():state.view==='review'?reviewView():state.view==='detail'?detail():home();$('app').innerHTML=view+sheet();const nav=$('app').querySelector('.bottomNav');if(nav)nav.closest('.page').classList.add('hasBottomNav');const rail=$('app').querySelector('.themeFilters');if(rail){rail.scrollLeft=themeScrollLeft;const selected=rail.querySelector('.selected');if(selected&&rail.clientWidth){const left=selected.offsetLeft-rail.offsetLeft;if(left<rail.scrollLeft)rail.scrollLeft=left;else if(left+selected.offsetWidth>rail.scrollLeft+rail.clientWidth)rail.scrollLeft=left+selected.offsetWidth-rail.clientWidth}}save()}
  document.addEventListener('change',e=>{if(!e.target.matches('[data-stage-select]'))return;const value=e.target.value;if(value==='all'||stages.some(s=>s.id===value)){state.stageFilter=value;render()}});
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action],[data-go],[data-book],[data-resume],[data-filter-theme]');if(!el)return;
    if(el.dataset.book){openBook(el.dataset.book);return}
    if(el.dataset.resume){openBook(el.dataset.resume,'reader');return}
    if(el.dataset.filterTheme){state.themeFilter=el.dataset.filterTheme;render();return}
    const action=el.dataset.action;
    if(action==='close'&&e.target.closest('.sheet')&&!e.target.closest('button[data-action="close"]'))return;
    if(el.dataset.go){go(el.dataset.go);return}
    switch(action){
      case'reader-back':returnFromReader();break;
      case'stage-guide':stop();state.sheet='stages';render();break;
      case'word-save':{const w=book.keywords.find(w=>w.id===state.wordId);if(w){state.wordSaves[book.id+':'+w.id]=true;render();toast('已加入我的小词本')}break;}
      case'vocabulary-word':stop();state.focusWordKey=el.dataset.key;state.sheet='vocabulary-word';render();break;
      case'vocabulary-audio':{const item=vocabularyItem(state.focusWordKey);if(item)playing?(stop(),render()):playVocabulary(item);break;}
      case'vocabulary-source':{const item=vocabularyItem(el.dataset.key);if(item){const source=sourceFor(item);state.readerReturn={view:state.view,sheet:state.sheet,focusWordKey:state.focusWordKey,review:state.review?{...state.review,keys:[...state.review.keys]}:null,bookId:book.id,scrollY:window.scrollY||0};book=source.book;state.page=source.pageIndex;go('reader')}break;}
      case'review-start':startReview(Number(el.dataset.count)||3);break;
      case'review-book':startReview(3,true);break;
      case'review-reveal':if(state.review){state.review.revealed=true;render()}break;
      case'review-audio':{const item=vocabularyItem(state.review?.keys[state.review.index]);if(item)playing?(stop(),render()):playVocabulary(item);break;}
      case'review-rate':{if(!state.review||!state.review.revealed)break;stop();const key=state.review.keys[state.review.index];state.wordReviews[key]=vocab.rate(state.wordReviews[key],el.dataset.remembered==='true');state.review.index++;state.review.revealed=false;render();break;}
      case'reset-filters':state.themeFilter='all';state.stageFilter='all';render();break;
      case'words':stop();state.sheet='words';state.wordId=null;render();break;
      case'word':stop();state.wordId=el.dataset.wordId;if(book.keywords.some(w=>w.id===state.wordId)){state.sheet='word';render()}break;
      case'word-audio':{const w=book.keywords.find(w=>w.id===state.wordId);if(w)playing?(stop(),render()):playPage(w.pageIndex,false);break;}
      case'favorite':state.saved=!state.saved;render();toast(state.saved?'已收藏':'已取消收藏');break;
      case'prev':previous();break;
      case'next':next(state.readMode==='listen'&&playing);break;
      case'together':stop();state.readMode='together';render();break;
      case'listen':state.readMode='listen';playPage(state.page,true);break;
      case'speak':playing?(stop(),render()):playPage(state.page,state.readMode==='listen');break;
      case'again':stop();state.page=0;state.finished=false;go('reader');break;
      case'prep-audio':state.sheet=null;state.page=Number(el.dataset.page);go('reader');playPage(state.page,false);break;
      case'companion':state.companionMode=!state.companionMode;render();break;
      case'prep':case'credits':case'original-art':stop();state.sheet=action;render();break;
      case'close':stop();state.sheet=null;render();break;
    }
  });
  let gesture=null;
  document.addEventListener('touchstart',e=>{gesture=!state.sheet&&e.target.closest('#artFrame')?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
  document.addEventListener('touchend',e=>{if(!gesture||state.view!=='reader'||state.sheet)return;const dx=e.changedTouches[0].clientX-gesture.x,dy=e.changedTouches[0].clientY-gesture.y;gesture=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3)dx<0?next(false):previous()},{passive:true});
  window.addEventListener('keydown',e=>{if(state.sheet){if(e.key==='Escape'){stop();state.sheet=null;render()}return}if(e.target.closest('button,input,a'))return;if(state.view==='reader'){if(e.key==='ArrowLeft')previous();if(e.key==='ArrowRight')next(false)}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){stop();render()}});
  window.addEventListener('pagehide',stop);
  render();
})();

</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register(new URL("sw.js",document.baseURI)).catch(()=>{}))}</script></body></html>
